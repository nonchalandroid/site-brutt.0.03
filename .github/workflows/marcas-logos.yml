# TEMPORÁRIO (25/10/2026): traz para imagens/marcas/ as logos oficiais já tratadas (brancas) que ficaram no
# armazenamento da loja (product-images/marcas/). Só roda quando scripts/marcas-baixar.txt muda nesta branch.
name: marcas-logos
on:
  push:
    branches: [claude/awesome-albattani-3xuh77]
    paths: [scripts/marcas-baixar.txt]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p imagens/marcas
          while read -r s; do
            [ -z "$s" ] && continue
            curl -fsSL "https://vedlxtljilsanykmddtj.supabase.co/storage/v1/object/public/product-images/marcas/$s.webp" -o "imagens/marcas/$s.webp" || echo "falhou: $s"
          done < scripts/marcas-baixar.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/marcas
          git commit -m "Logos das marcas: arquivos tratados trazidos do armazenamento da loja" || exit 0
          git push
