async function importarClientes(arq){
  let lista;
  try{ lista = JSON.parse(await arq.text()); }catch(_){ toast("Arquivo inválido: precisa ser a lista em JSON exportada do Nex."); return; }
  if(lista && !Array.isArray(lista)) lista = lista.clientes || lista.data || lista.items;
  if(!Array.isArray(lista) || !lista.length){ toast("Nenhum cliente encontrado no arquivo."); return; }
  if(!confirm(`Importar ${lista.length} cliente(s)? Quem já existe (mesmo código Nex ou WhatsApp) só tem os campos vazios preenchidos; nada do que foi editado aqui é apagado.`)) return;
  const b = $("#cliImp"); b.disabled = true;
  let novos = 0, mesclados = 0, ignorados = 0;
  try{
    for(let i = 0; i < lista.length; i += 300){
      b.textContent = `Importando ${Math.min(i + 300, lista.length)}/${lista.length}…`;
      const { data, error } = await sb.rpc("clientes_importar", { lista: lista.slice(i, i + 300), origem_padrao: "nex" });
      if(error) throw error;
      novos += data.novos; mesclados += data.mesclados; ignorados += data.ignorados;
    }
    toast(`Importado: ${novos} novo(s), ${mesclados} atualizado(s)${ignorados ? `, ${ignorados} sem nome ignorado(s)` : ""}.`);
  }catch(err){ toast("Erro ao importar: " + (err.message || err)); }
  b.disabled = false; b.innerHTML = `${ic("up")} Importar`;
  await carregarClientes(); desenhaClientes();
}
function exportarClientes(){
  const lista = cliFiltrados(); if(!lista.length){ toast("Nada para exportar neste filtro."); return; }
  const col = [["nome","Nome"],["whatsapp","WhatsApp"],["email","E-mail"],["cep","CEP"],["rua","Rua"],["numero","Número"],["complemento","Complemento"],["bairro","Bairro"],["cidade","Cidade"],["uf","UF"],["endereco_txt","Endereço (texto)"],["nex_codigo","Código Nex"],["aceita_promocoes","Aceita promoções"],["completo","Completo"],["pedidos_qtd","Pedidos no site"],["total_gasto","Total gasto no site"],["ultimo_pedido_em","Último pedido"],["origem","Origem"],["obs","Observações"]];
  const cel = v => { v = v == null ? "" : typeof v === "boolean" ? (v ? "sim" : "não") : String(v); if(/^[=+\-@]/.test(v)) v = "'" + v; return /[";\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = "﻿" + [col.map(c => c[1]).join(";"), ...lista.map(c => col.map(([k]) => cel(k === "total_gasto" ? String(c[k] ?? 0).replace(".", ",") : c[k])).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = `clientes-brutt-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------------- Sommelier em massa ----------------
   Roda o Sommelier (função gerar-ficha-sommelier) em fila, vários produtos ao mesmo tempo, e grava sozinho só o que
   a regra escolhida permite. Cada mudança fica em sommelier_log (antes/depois) para desfazer um produto ou o lote todo.
   A fila roda no navegador: a aba precisa ficar aberta até terminar (pode navegar por outras telas do painel). */
const SM_GENERICAS = ["headshop-outros", "doces-outros", "bebidas-bebidas"];
const SM_LOTES = [
  ["desc", "Descrição faltando, rasa ou cortada", p => { const d = (p.description||"").trim().length; return d <= 80 || d > SOM_DESC_MAX; }],
  ["ficha", "Ficha técnica curta (até 2 itens)", p => (p.specs||[]).length <= 2],
  ["perfil", "Essências sem perfil de sabor", p => somCatInfo(p.category_id).essencia && !p.flavor_profile],
  ["whisky", "Whisky sem detalhes", p => somCatInfo(p.category_id).whisky && !p.whisky_details],
  ["generica", "Categoria genérica (Outros)", p => SM_GENERICAS.includes((state.categories.find(c => c.id === p.category_id)||{}).slug)],
  ["incompletos", "Qualquer coisa faltando", null],
  ["todos", "Todos os produtos", () => true],
];
let smRun = null;   /* lote em andamento (sobrevive à troca de tela) */
const smCatSlug = id => (state.categories.find(c => c.id === id) || {}).slug || "";
const smCatNome = slug => { const c = state.categories.find(x => x.slug === slug), pa = c && state.categories.find(x => x.id === c.parent_id); return c ? (pa ? pa.name + " › " : "") + c.name : slug; };
function smFiltro(k){
  if(k === "incompletos"){ const fs = SM_LOTES.filter(l => ["desc","ficha","perfil","whisky","generica"].includes(l[0])).map(l => l[2]); return p => fs.some(f => f(p)); }
  return (SM_LOTES.find(l => l[0] === k) || SM_LOTES[0])[2];
}
/* decide o que gravar a partir da sugestão `d`; devolve { upd, antes } (vazio = nada a mudar) */
function smDecide(p, d, o){
  const upd = {}, info = somCatInfo(p.category_id), dl = (p.description||"").trim().length, nSpecs = (p.specs||[]).length, tudo = o.modo === "reescrever";
  if(o.desc && (d.description||"").length >= 40 && (tudo || dl <= 80 || dl > SOM_DESC_MAX) && d.description.trim() !== (p.description||"").trim()) upd.description = d.description.trim();
  if(o.ficha && (d.specs||[]).length >= 2 && (tudo ? true : nSpecs <= 2 && d.specs.length > nSpecs)) upd.specs = d.specs;
  if(o.perfil && info.essencia && d.flavor_profile && (tudo || !p.flavor_profile)) upd.flavor_profile = d.flavor_profile;
  if(o.whisky && info.whisky && d.whisky_details && (tudo || !p.whisky_details)) upd.whisky_details = d.whisky_details;
  if(o.cat && d.categoria_sugerida && d.confianca === "alta" && d.categoria_sugerida !== smCatSlug(p.category_id)){
    const c = state.categories.find(x => x.slug === d.categoria_sugerida); if(c && c.parent_id) upd.category_id = c.id;
  }
  const antes = {}; Object.keys(upd).forEach(k => antes[k] = p[k] ?? null);
  return { upd, antes };
}
function smResumoMud(upd){
  const t = [];
  if("description" in upd) t.push("descrição"); if("specs" in upd) t.push(`ficha (${upd.specs.length})`);
  if("flavor_profile" in upd) t.push("perfil de sabor"); if("whisky_details" in upd) t.push("detalhes do whisky");
  if("category_id" in upd) t.push("categoria → " + smCatNome(smCatSlug(upd.category_id)));
  return t.join(", ");
}

  const ler = () => ({ lote: $("#smLote").value, estoque: $("#smEstoque").checked, desc: $("#smDesc").checked, ficha: $("#smFicha").checked, perfil: $("#smPerfil").checked,

  const contar = () => {

    $("#smQtd").innerHTML = n ? `<b>${n}</b> produto${n > 1 ? "s" : ""} · cerca de ${min} min` : "Nenhum produto nesse filtro.";

  corpo.querySelectorAll("input,select").forEach(el => el.addEventListener("change", contar));
  contar();
  $("#smIr").onclick = () => { if(smRun && !smRun.fim) return; smComeca(fila(), ler()); };
  $("#smPausa").onclick = () => { if(!smRun) return; smRun.pausa = !smRun.pausa; smDesenha(); };
  $("#smParar").onclick = () => { if(smRun && confirm("Parar o lote? O que já foi gravado continua salvo (e pode ser desfeito).")){ smRun.parar = true; smRun.pausa = false; smDesenha(); } };
  $("#smDesfazLote").onclick = smDesfazLote;
  smDesenha();
}
function smComeca(lista, o){
  if(!lista.length) return;
  const cats = o.cat ? state.categories.filter(c => c.parent_id).map(c => ({ slug: c.slug, nome: smCatNome(c.slug).replace(" › ", " > ") })) : null;
  smRun = { o, cats, fila: lista.map(p => ({ p, st: "fila" })), lote: "sm-" + Date.now().toString(36), ini: Date.now(), pausa: false, parar: false, fim: false, feitos: 0, tempos: [] };
  window.addEventListener("beforeunload", smAvisoSaida);
  for(let i = 0; i < Math.min(o.juntos || 3, smRun.fila.length); i++) smTrabalhador(smRun);
  smDesenha();
}
function smAvisoSaida(e){ if(smRun && !smRun.fim){ e.preventDefault(); e.returnValue = ""; } }
async function smTrabalhador(run){
  for(;;){
    if(run.parar) break;
    while(run.pausa && !run.parar) await new Promise(r => setTimeout(r, 500));
    const it = run.fila.find(x => x.st === "fila"); if(!it || run.parar) break;
    it.st = "rodando"; smDesenha();
    const t0 = Date.now(), p = it.p, info = somCatInfo(p.category_id);
    for(let tent = 0; tent < 3; tent++){
      try{
        const d = await somChamar({ name: p.name, brand: p.brand||"", ean: p.ean||"", categoria: info.categoria, subcategoria: info.subcategoria, pesquisar: run.o.pesquisar,
          existente: { description: p.description||"", specs: p.specs||[], flavor_profile: p.flavor_profile||null, whisky_details: p.whisky_details||null },
          ...(run.cats ? { categorias: run.cats, categoria_slug_atual: smCatSlug(p.category_id) } : {}) });
        it.conf = d.confianca; it.avisos = d.avisos || [];
        if(d.confianca === "baixa" && !run.o.baixa){ it.st = "revisar"; it.msg = "Confiança baixa: abra a ficha e revise."; break; }
        const { upd, antes } = smDecide(p, d, run.o);
        if(!Object.keys(upd).length){ it.st = "nada"; it.msg = "Já estava completo."; break; }
        const lg = await sb.from("sommelier_log").insert({ product_id: p.id, antes, depois: upd, confianca: d.confianca, avisos: it.avisos, lote: run.lote }).select("id").single();
        if(lg.error) throw new Error("histórico: " + lg.error.message);
        const { error } = await sb.from("products").update(upd).eq("id", p.id);
        if(error) throw new Error(error.message);
        Object.assign(p, upd); it.st = "ok"; it.logId = lg.data.id; it.msg = smResumoMud(upd); break;
      }catch(e){
        const m = e.message || String(e);
        if(/limite|429/i.test(m) && tent < 2){ it.msg = "Limite do Gemini: esperando 1 min…"; smDesenha(); await new Promise(r => setTimeout(r, 60000)); continue; }
        it.st = "erro"; it.msg = m; break;
      }
    }
    run.feitos++; run.tempos.push(Date.now() - t0); smDesenha();
  }
  if(!run.fim && !run.fila.some(x => x.st === "rodando")){
    run.fim = true; window.removeEventListener("beforeunload", smAvisoSaida);
    const ok = run.fila.filter(x => x.st === "ok").length;
    toast(run.parar ? `Lote parado. ${ok} produto(s) atualizado(s).` : `Sommelier terminou: ${ok} produto(s) atualizado(s).`); bipe(); smDesenha();
  }
}
function smDesenha(){
  const r = smRun, prog = $("#smProg"); if(!prog) return;
  const pausa = $("#smPausa"), parar = $("#smParar"), ir = $("#smIr");
  if(!r){ return; }
  const tot = r.fila.length, c = s => r.fila.filter(x => x.st === s).length, ativo = !r.fim;
  prog.hidden = false; $("#smLogH").hidden = !r.fila.some(x => x.logId);
  pausa.hidden = parar.hidden = !ativo; pausa.textContent = r.pausa ? "Continuar" : "Pausar";
  if(ativo){ ir.textContent = r.parar ? "Parando…" : r.pausa ? "Pausado" : "Trabalhando…"; ir.disabled = true; }
  else { ir.disabled = false; ir.textContent = "Começar outro lote"; }
  $("#smBarra").style.transform = `scaleX(${tot ? r.feitos / tot : 0})`;
  const med = r.tempos.length ? r.tempos.reduce((a, b) => a + b, 0) / r.tempos.length : 0, falta = tot - r.feitos;
  const resta = ativo && med ? ` · faltam ~${Math.max(1, Math.round(falta * med / (r.o.juntos || 3) / 60000))} min` : "";
  $("#smStatus").innerHTML = `<b>${r.feitos} de ${tot}</b> · ✓ ${c("ok")} gravados · ${c("nada")} já completos · <span class="sm-rev">${c("revisar")} para revisar</span> · <span class="sm-err">${c("erro")} com erro</span>${resta}${r.pausa && ativo ? " · <b>pausado</b>" : ""}${ativo ? `<br><small>Deixe esta aba aberta até terminar.</small>` : ""}`;
  const rot = { fila:"na fila", rodando:"analisando…", ok:"gravado", nada:"sem mudança", revisar:"revisar", erro:"erro", desfeito:"desfeito" };
  const vis = r.fila.filter(x => x.st !== "fila").slice().reverse().slice(0, 300);
  $("#smLog").innerHTML = vis.map(x => `<div class="sm-it st-${x.st}">
      <div class="sm-it-h"><b>${esc(x.p.name)}</b><span class="sm-tag t-${x.st}">${rot[x.st]}</span></div>
      ${x.msg ? `<p>${esc(x.msg)}</p>` : ""}${x.conf ? `<small>confiança ${esc(x.conf)}${(x.avisos||[]).length ? " · ⚠ " + esc(x.avisos[0]) : ""}</small>` : ""}
      <div class="sm-it-a"><button class="btn-ghost btn-sm" data-sm-abrir="${esc(x.p.id)}">Abrir ficha</button>${x.st === "ok" ? `<button class="btn-ghost btn-sm" data-sm-desfaz="${x.logId}">Desfazer</button>` : ""}</div>
    </div>`).join("");
  $("#smLog").querySelectorAll("[data-sm-abrir]").forEach(b => b.onclick = () => openProduct(b.dataset.smAbrir));
  $("#smLog").querySelectorAll("[data-sm-desfaz]").forEach(b => b.onclick = () => smDesfaz(+b.dataset.smDesfaz, b));
}
async function smDesfaz(logId, b){
  const it = smRun && smRun.fila.find(x => x.logId === logId);
  if(b) b.disabled = true;
  const { data: lg, error } = await sb.from("sommelier_log").select("id,product_id,antes,desfeito_em").eq("id", logId).single();
  if(error || !lg){ toast("Não achei o histórico desse produto."); if(b) b.disabled = false; return false; }
  if(lg.desfeito_em){ toast("Esse já foi desfeito."); return false; }
  const up = await sb.from("products").update(lg.antes).eq("id", lg.product_id);
  if(up.error){ toast("Não deu para desfazer: " + up.error.message); if(b) b.disabled = false; return false; }
  await sb.from("sommelier_log").update({ desfeito_em: new Date().toISOString() }).eq("id", logId);
  if(it){ Object.assign(it.p, lg.antes); it.st = "desfeito"; it.msg = "Voltou como era antes."; }
  if(b){ toast("Desfeito."); smDesenha(); }
  return true;
}
async function smDesfazLote(){
  if(!smRun) return;
  const alvos = smRun.fila.filter(x => x.st === "ok" && x.logId);
  if(!alvos.length){ toast("Nada para desfazer neste lote."); return; }
  if(!confirm(`Desfazer as mudanças de ${alvos.length} produto(s) deste lote? Eles voltam exatamente como eram antes.`)) return;
  let n = 0; for(const x of alvos){ if(await smDesfaz(x.logId)) n++; }
  toast(`${n} produto(s) voltaram como eram.`); smDesenha();
}

/* ===================== Equipe: quem entra no painel e o que pode fazer ===================== */
/* Lista/papel/ativo = RPCs equipe_listar e equipe_alterar (o banco confere a hierarquia).
   Criar login e trocar senha = função "equipe" (precisa da chave de serviço, que só o servidor tem). */
const EQ_PODE = {
  owner: "Tudo, inclusive adicionar administradores.",
  admin: "Tudo no painel. Adiciona e gerencia atendentes.",
  atendente: "Só pedidos: vê, avisa o cliente e avança as etapas. Não mexe em produtos, preços, estoque, fotos, horários nem clientes.",
};
let eqLista = null;
async function equipeChamar(acao, corpo){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPA_URL}/functions/v1/equipe?acao=${acao}`, { method:"POST",
    headers:{ apikey: SUPA_KEY, Authorization: "Bearer " + session.access_token, "Content-Type":"application/json" }, body: JSON.stringify(corpo || {}) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.erro || ("erro " + r.status));
  return j;
}
const eqSenhaOk = s => s.length >= 8 && /[A-Za-z]/.test(s) && /\d/.test(s);
function eqGeraSenha(){
  const pal = ["Brasa","Fumaca","Narga","Rosh","Menta","Carvao","Sessao","Essencia"], n = new Uint32Array(2); crypto.getRandomValues(n);
  return pal[n[0] % pal.length] + String(1000 + n[1] % 9000);
}
const eqQuando = d => {
  if(!d) return "nunca entrou";
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if(m < 2) return "entrou agora"; if(m < 60) return `entrou há ${m} min`;
  const h = Math.round(m / 60); if(h < 24) return `entrou há ${h} h`;
  return "último acesso " + new Date(d).toLocaleDateString("pt-BR");
};
async function renderEquipe(){
  app.innerHTML = `${topbarHTML("Equipe")}
    <div class="pg">
      <div class="pg-h"><div><h2 class="pg-t">Equipe</h2><p class="pg-d">Quem entra no painel e o que cada um pode fazer. Ninguém é apagado: quem sai da loja é <b>desativado</b> e perde o acesso na hora.</p></div>
        <button class="btn-indigo btn-sm" id="eqNovo">${ic("plus")} Adicionar pessoa</button></div>
      <div class="eq-papeis">${["owner","admin","atendente"].map(p => `<div class="eq-pp eq-${p}"><b>${PAPEL[p]}</b><span>${EQ_PODE[p]}</span></div>`).join("")}</div>
      <div id="eqLista"><div class="loading">Carregando…</div></div>
    </div>`;
  bindTopbar();
  $("#eqNovo").onclick = () => eqAbrirNovo();
  await eqCarregar();
}
async function eqCarregar(){
  const { data, error } = await sb.rpc("equipe_listar");
  const box = $("#eqLista"); if(!box) return;
  if(error){ box.innerHTML = `<div class="empty">Não deu para carregar a equipe: ${esc(error.message)}</div>`; return; }
  eqLista = data || [];
  box.innerHTML = `<div class="eq-lista">${eqLista.map(m => `
    <button type="button" class="eq-card${m.ativo ? "" : " off"}" data-eq="${esc(m.user_id)}">
      <span class="avatar" aria-hidden="true">${esc((m.nome || "?").split(/\s+/).map(w => (w.match(/[\p{L}\d]/u) || [""])[0]).filter(Boolean).slice(0, 2).join("").toUpperCase() || "?")}</span>
      <span class="eq-tx"><b>${esc(m.nome)}${m.eu ? ' <em class="eq-eu">você</em>' : ""}</b><span class="eq-mail">${esc(m.email || "sem e-mail")}</span>
        <small>${m.ativo ? esc(eqQuando(m.ultimo_acesso)) : "Desativado · sem acesso ao painel"}</small></span>
      <span class="cli-tag eq-tag eq-${esc(m.papel)}">${esc(PAPEL[m.papel] || m.papel)}</span>
    </button>`).join("")}</div>`;
  box.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => eqAbrir(eqLista.find(m => m.user_id === b.dataset.eq)));
}
function eqPapelHTML(atual, souDono){
  return `<div class="eq-op" role="radiogroup" aria-label="Papel">${["atendente","admin"].map(p => {
    const trava = p === "admin" && !souDono;
    return `<label class="eq-r${trava ? " trava" : ""}"><input type="radio" name="eqPapel" value="${p}"${atual === p ? " checked" : ""}${trava ? " disabled" : ""}>
      <span><b>${PAPEL[p]}</b><small>${trava ? "Só o dono pode dar esse papel." : EQ_PODE[p]}</small></span></label>`; }).join("")}</div>`;
}
const eqSenhaHTML = (id, rot) => `<div class="field"><label for="${id}">${rot}</label><div class="eq-senha">
  <input id="${id}" type="text" autocomplete="new-password" autocapitalize="off" spellcheck="false" maxlength="72" placeholder="mín. 8, letras e números">
  <button type="button" class="btn-ghost btn-sm" data-gera="${id}">Gerar</button></div></div>`;
function eqBindGera(){ document.querySelectorAll("[data-gera]").forEach(b => b.onclick = () => { const i = $("#" + b.dataset.gera); i.value = eqGeraSenha(); i.focus(); i.select(); }); }
function eqAbrirNovo(){
  const souDono = state.staff?.role === "owner";
  openDrawer(`
    <div class="drawer-h"><h2>Adicionar pessoa</h2><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="section">
      <div class="field"><label for="eqNome">Nome (aparece no painel)</label><input id="eqNome" maxlength="60" autocomplete="off" placeholder="ex.: João – balcão"></div>
      <div class="field"><label for="eqEmail">E-mail (é o login dela)</label><input id="eqEmail" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120"></div>
    </div>
    <div class="section"><h3>Papel</h3>${eqPapelHTML("atendente", souDono)}</div>
    <div class="section"><h3>Senha inicial</h3>${eqSenhaHTML("eqSenha", "Senha")}
      <p class="eq-nota">Passe a senha para a pessoa por mensagem. Se ela esquecer, você define outra aqui na Equipe.</p></div>
    <div class="save-row"><button class="btn-gold" id="eqCriar" style="flex:1">Adicionar</button></div>`);
  eqBindGera(); setTimeout(() => $("#eqNome")?.focus(), 250);
  $("#eqCriar").onclick = async () => {
    const b = $("#eqCriar"); if(b.disabled) return;
    const nome = $("#eqNome").value.trim(), email = $("#eqEmail").value.trim().toLowerCase(), senha = $("#eqSenha").value.trim();
    const papel = (document.querySelector('[name="eqPapel"]:checked') || {}).value;
    if(nome.length < 2){ toast("Escreva o nome da pessoa."); $("#eqNome").focus(); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ toast("E-mail inválido."); $("#eqEmail").focus(); return; }
    if(!eqSenhaOk(senha)){ toast("Senha: pelo menos 8 caracteres, com letras e números. Toque em “Gerar”."); $("#eqSenha").focus(); return; }
    b.disabled = true; b.classList.add("is-busy");
    try{
      const r = await equipeChamar("criar", { nome, email, papel, senha });
      closeDrawer();
      toast(r.ja_tinha_login ? `${nome} já tinha login: entra com a senha que já usa (se não lembrar, abra o nome e use “Definir nova senha”).` : `${nome} adicionado. Login: ${email}`);
      await eqCarregar();
    }catch(e){ toast(e.message); }
    finally{ b.disabled = false; b.classList.remove("is-busy"); }
  };
}
function eqAbrir(m){
  if(!m) return;
  const souDono = state.staff?.role === "owner", edita = m.posso_editar, eu = m.eu;
  openDrawer(`
    <div class="drawer-h"><h2>${esc(m.nome)}</h2><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="section"><p class="eq-info"><span class="eq-mail">${esc(m.email || "")}</span><span class="cli-tag eq-tag eq-${esc(m.papel)}">${esc(PAPEL[m.papel] || m.papel)}</span>${m.ativo ? "" : '<span class="cli-tag inc">Desativado</span>'}</p>
      <p class="eq-nota">${esc(m.ativo ? eqQuando(m.ultimo_acesso) : "Sem acesso ao painel.")}</p></div>
    ${edita || eu ? `<div class="section"><h3>Nome</h3><div class="eq-senha"><input id="eqNomeEd" maxlength="60" value="${esc(m.nome)}" autocomplete="off" aria-label="Nome"><button type="button" class="btn-ghost btn-sm" id="eqNomeOk">Salvar</button></div></div>` : ""}
    ${edita && m.ativo ? `<div class="section"><h3>Papel</h3>${eqPapelHTML(m.papel, souDono)}</div>` : ""}
    ${edita || eu ? `<div class="section"><h3>${eu ? "Trocar minha senha" : "Definir nova senha"}</h3>${eqSenhaHTML("eqSenhaEd", "Nova senha")}
      <div class="save-row" style="margin-top:0"><button class="btn-ghost" id="eqSenhaOk" style="flex:1">${ic("key")} ${eu ? "Trocar minha senha" : "Definir senha"}</button></div>
      ${eu ? "" : '<p class="eq-nota">A senha antiga para de funcionar. Passe a nova para a pessoa.</p>'}</div>` : ""}
    ${edita ? `<div class="section"><h3>Acesso</h3>${m.ativo
      ? `<p class="eq-nota">Desativar tira o acesso ao painel na hora. Os pedidos e o histórico ficam.</p><button class="btn-danger full" id="eqAtivo">Desativar ${esc(m.nome.split(" ")[0])}</button>`
      : `<button class="btn-gold full" id="eqAtivo">Reativar ${esc(m.nome.split(" ")[0])}</button>`}</div>` : ""}
    ${!edita && !eu ? `<div class="section"><p class="eq-nota">${m.papel === "owner" ? "O dono não pode ser alterado por aqui." : "Só o dono altera administradores."}</p></div>` : ""}`);
  eqBindGera();
  const alterar = async (args, msg) => {
    const { error } = await sb.rpc("equipe_alterar", { p_user: m.user_id, p_nome: null, p_papel: null, p_ativo: null, ...args });
    if(error){ toast(error.message); return false; }
    toast(msg); await eqCarregar();
    if(eu && args.p_nome){ state.staff.name = args.p_nome; renderEquipe(); }
    return true;
  };
  $("#eqNomeOk") && ($("#eqNomeOk").onclick = async () => { const n = $("#eqNomeEd").value.trim(); if(n.length < 2){ toast("Nome muito curto."); return; } if(await alterar({ p_nome: n }, "Nome salvo.")) closeDrawer(); });
  document.querySelectorAll('[name="eqPapel"]').forEach(r => r.onchange = async () => {
    if(!(await alterar({ p_papel: r.value }, `${m.nome} agora é ${PAPEL[r.value]}.`))) return; closeDrawer();
  });
  $("#eqAtivo") && ($("#eqAtivo").onclick = async () => {
    if(m.ativo && !confirm(`Desativar ${m.nome}? Ela deixa de entrar no painel na hora.`)) return;
    if(await alterar({ p_ativo: !m.ativo }, m.ativo ? `${m.nome} foi desativado.` : `${m.nome} foi reativado.`)) closeDrawer();
  });
  $("#eqSenhaOk") && ($("#eqSenhaOk").onclick = async () => {
    const b = $("#eqSenhaOk"), senha = $("#eqSenhaEd").value.trim(); if(b.disabled) return;
    if(!eqSenhaOk(senha)){ toast("Senha: pelo menos 8 caracteres, com letras e números."); $("#eqSenhaEd").focus(); return; }
    b.disabled = true; b.classList.add("is-busy");
    try{ await equipeChamar("senha", { user_id: m.user_id, senha }); closeDrawer(); toast(eu ? "Senha trocada." : `Nova senha de ${m.nome} definida.`); }
    catch(e){ toast(e.message); }
    finally{ b.disabled = false; b.classList.remove("is-busy"); }
  });
}
