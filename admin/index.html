<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brutt · Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#120b07; --surface:#1c130c; --surface-2:#241a11; --line:#3a2a1a;
  --gold:#d8a638; --gold-2:#f0cc74; --ink:#f3e4c8; --muted:#b8a184;
  --red:#c0453a; --green:#3f7a4e;
  box-sizing:border-box;
}
.brand-logo{width:30px;height:30px;border-radius:50%;flex:none}
@media (prefers-color-scheme: light){ :root{} }
*{box-sizing:inherit}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2px;margin:0}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn-gold{background:var(--gold);color:#241705}
.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
a{color:var(--gold-2)}

/* ---------- shell ---------- */
#app{max-width:980px;margin:0 auto;padding:0 14px 60px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px calc(14px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:baseline;gap:8px}
.topbar .brand b{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--gold-2);text-transform:uppercase}
.topbar .brand span{font-size:12px;color:var(--muted)}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}

/* ---------- login ---------- */
.center-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.login-card{width:100%;max-width:360px}
.login-card h1{font-size:30px;color:var(--gold-2);margin-bottom:4px}
.login-card p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.err{color:var(--red);font-size:13px;margin-top:10px}
.full{width:100%}

/* ---------- search ---------- */
.scan-wrap{margin:16px 0 10px}
.scan-wrap input{font-size:18px;padding:14px 16px}
.scan-hint{font-size:12px;color:var(--muted);margin-top:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* ---------- product list ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;cursor:pointer}
.prow:hover{border-color:var(--gold)}
.prow .thumb{width:46px;height:46px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;
  justify-content:center;font-size:22px;overflow:hidden;flex:none}
.prow .thumb img{width:100%;height:100%;object-fit:cover}
.prow .info{flex:1;min-width:0}
.prow .info .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .info .m{font-size:12px;color:var(--muted)}
.prow .right{text-align:right;flex:none}
.prow .right .price{font-weight:700;color:var(--gold-2)}
.prow .right .stock{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin-left:6px}
.badge.off{color:var(--red);border-color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* ---------- modal/drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.veil.on{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--bg);border-left:1px solid var(--line);
  z-index:21;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer-h h2{font-size:22px}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:8px;min-width:40px;min-height:40px}
.section{margin-bottom:22px}
.section h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;font-weight:600;font-family:'Barlow',sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-box{display:flex;align-items:center;gap:14px}
.photo-box .ph{width:84px;height:84px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;
  justify-content:center;font-size:36px;overflow:hidden;flex:none}
.photo-box .ph img{width:100%;height:100%;object-fit:cover}
.stock-now{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.stock-now .n{font-size:32px;font-weight:700;color:var(--gold-2);font-family:'Barlow Condensed',sans-serif}
.mv-tabs{display:flex;gap:6px;margin-bottom:10px}
.mv-tabs button{flex:1}
.mv-tabs button.active{background:var(--gold);color:#241705}
.mv-tabs button:not(.active){background:var(--surface-2);color:var(--muted)}
.hist{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.hist-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist-row .t{color:var(--muted)}
.save-row{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#241705;
  padding:10px 18px;border-radius:10px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch .track::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ink);top:3px;left:3px;transition:.2s}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(18px)}
.loading{text-align:center;color:var(--muted);padding:30px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f}
.btn-google:hover{background:#f2f2f2}
.btn-google svg{width:18px;height:18px}
.sync-table{width:100%;border-collapse:collapse;font-size:13px}
.sync-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
  padding:6px 8px;border-bottom:1px solid var(--line)}
.sync-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.sync-table select,.sync-table input{padding:6px 8px;font-size:13px}
.score{font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line)}
.score.alta{color:var(--green);border-color:var(--green)}
.score.baixa{color:var(--red);border-color:var(--red)}
.score.media{color:var(--gold-2);border-color:var(--gold-2)}
.sync-summary{display:flex;gap:16px;margin:10px 0;font-size:13px;color:var(--muted)}
.sync-summary b{color:var(--ink)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone:hover{border-color:var(--gold)}
.tbl-wrap{overflow-x:auto;max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.cat-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 10px;text-align:center}
.cat-btn:hover{border-color:var(--gold)}
.cat-btn .ic{font-size:26px;display:block;margin-bottom:6px}
.cat-btn .nm{font-weight:600;font-size:14px;display:block}
.cat-btn .ct{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.active{background:var(--gold);color:#241705;border-color:var(--gold);font-weight:600}
.cat-head{display:flex;align-items:center;gap:10px;margin:4px 0 4px}
.cat-head h2{font-size:24px}
.prow .info .brand{font-size:11px;color:var(--gold-2)}
.prow .right .cost{font-size:11px;color:var(--muted)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--gold-2)}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.warn .val{color:var(--red)}
.cov-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.cov-bar .fill{height:100%;background:var(--gold)}
.dash-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.dash-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
.dash-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.dash-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.roi-pos{color:var(--green)}
.roi-neg{color:var(--red)}

.bulk-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:7px}
.bulk-row .thumb-mini{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none;cursor:pointer;border:2px solid transparent}
.bulk-row .thumb-mini:hover{border-color:var(--gold)}
.bulk-row .thumb-mini img{width:100%;height:100%;object-fit:cover}
.bulk-row .nm{flex:1;min-width:110px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bulk-row .campos{display:flex;gap:6px;flex-wrap:wrap}
.bulk-row .campos .f{display:flex;flex-direction:column;gap:2px}
.bulk-row .campos .f label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bulk-row .campos .f input{width:84px;padding:6px 7px;font-size:13px}
.bulk-row.dirty{border-color:var(--gold)}
.bulk-row.selected{border-color:var(--gold);background:var(--surface-2)}
.bulk-row .bulkSaveBtn{flex:none}
.bulk-row .bulkSaveBtn.saved{background:var(--green);color:#fff}
.bulk-chk{width:20px;height:20px;flex:none}
.pub-badge{display:block;font-size:10px;margin-top:2px}
.pub-badge.off{color:var(--muted)}
.bulk-actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--gold);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.bulk-count{font-weight:700;color:var(--gold-2);margin-right:4px}
@media (min-width:860px){
  .bulk-actionbar{left:auto;right:16px;bottom:16px;width:fit-content;border-radius:14px;border:1px solid var(--gold)}
}

.ean-row{display:flex;gap:6px}
.ean-row input{flex:1}
.btn-icon{flex:none;padding:10px 12px;font-size:16px}
.scanner-veil{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.scanner-box{width:100%;max-width:420px;background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.scanner-box #scanRegion{width:100%;border-radius:10px;overflow:hidden;background:#000}
.scanner-hint{font-size:12px;color:var(--muted);margin:10px 0}
.crop-veil{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}
.crop-view{width:min(78vw,340px);height:min(78vw,340px);border-radius:12px;overflow:hidden;position:relative;background:#000;touch-action:none;cursor:grab;border:2px solid var(--gold)}
.crop-view:active{cursor:grabbing}
.crop-view img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-controls{width:min(78vw,340px);display:flex;align-items:center;gap:10px}
.crop-controls input[type=range]{flex:1}
.crop-actions{display:flex;gap:10px;width:min(78vw,340px)}
.crop-actions button{flex:1}
.crop-hint{font-size:12px;color:var(--muted);text-align:center}
.photo-upload-box{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer}
.photo-upload-box:hover{border-color:var(--gold)}
.photo-upload-box img{max-width:120px;max-height:120px;border-radius:10px;display:block;margin:0 auto 8px}
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="veil"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL = "https://vedlxtljilsanykmddtj.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZGx4dGxqaWxzYW55a21kZHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NjYzNzUsImV4cCI6MjEwNjE0MjM3NX0.JlUPvGdomBHLlu5ei5dEb1qFR4FZ2nC45JTZUJ-IN6g";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const BUCKET = "product-images";

const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
let state = { session:null, staff:null, categories:[], results:[], current:null, mvType:"entrada" };

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"), 2200);
}
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function brl(v){ return (v==null) ? "—" : "R$ " + Number(v).toFixed(2).replace(".", ","); }

/* ---------------- boot ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(!session){ renderLogin(); return; }
  await loadStaffAndContinue();
}
sb.auth.onAuthStateChange((_evt, session) => { state.session = session; });

async function loadStaffAndContinue(){
  app.innerHTML = `<div class="loading">Carregando…</div>`;
  const { data: staffRows } = await sb.from("staff").select("*").eq("user_id", state.session.user.id);
  state.staff = (staffRows && staffRows[0]) || null;
  if(!state.staff){ renderAccessDenied(); return; }
  const { data: cats } = await sb.from("categories").select("id,name,slug,parent_id").order("name");
  state.categories = cats || [];
  renderMain();
}

/* ---------------- login ---------------- */
function renderLogin(){
  app.innerHTML = `
    <div class="center-screen">
      <div class="card login-card">
        <h1>Brutt</h1>
        <p class="sub">Painel interno · entre com sua conta</p>
        <div class="field"><label>E-mail</label><input type="email" id="loEmail" autocomplete="username"></div>
        <div class="field"><label>Senha</label><input type="password" id="loPass" autocomplete="current-password"></div>
        <button class="btn-gold full" id="loBtn">Entrar</button>
        <div class="err" id="loErr" hidden></div>
      </div>
    </div>`;
  $("#loBtn").onclick = async () => {
    const email = $("#loEmail").value.trim(), password = $("#loPass").value;
    $("#loErr").hidden = true;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ $("#loErr").textContent = "E-mail ou senha incorretos."; $("#loErr").hidden = false; return; }
    state.session = data.session;
    await loadStaffAndContinue();
  };
  $("#loPass").addEventListener("keydown", e => { if(e.key==="Enter") $("#loBtn").click(); });
}

function renderAccessDenied(){
  app.innerHTML = `
    <div class="center-screen">
      <div class="card login-card">
        <h1>Sem acesso</h1>
        <p class="sub">Sua conta está autenticada, mas ainda não foi liberada para o painel. Peça para um administrador te adicionar na equipe.</p>
        <button class="btn-ghost full" id="loOut">Sair</button>
      </div>
    </div>`;
  $("#loOut").onclick = async () => { await sb.auth.signOut(); renderLogin(); };
}

/* ---------------- main shell ---------------- */
async function renderMain(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><img src="../favicon/apple-touch-icon.png" alt="" class="brand-logo"><b>Brutt</b><span>admin</span></div>
      <div class="who">${esc(state.staff.name)} <button class="btn-ghost btn-sm" id="outBtn">Sair</button></div>
    </div>
    <div class="scan-wrap">
      <input id="searchBox" placeholder="Bipar EAN, ou buscar por nome / SKU…" autofocus>
      <div class="scan-hint">Um leitor de código de barras funciona direto aqui — ele "digita" o código e aperta Enter sozinho.</div>
    </div>
    <div class="toolbar">
      <button class="btn-gold btn-sm" id="newBtn">+ Novo produto</button>
      <button class="btn-ghost btn-sm" id="syncBtn">📥 Sincronizar planilha de compra</button>
      <button class="btn-ghost btn-sm" id="bestBtn">📊 Atualizar mais vendidos (NEX)</button>
      <button class="btn-ghost btn-sm" id="bulkBtn">✏️ Edição em massa</button>
      <button class="btn-ghost btn-sm" id="lowStockBtn">⚠️ Estoque baixo</button>
    </div>
    <div id="browseArea"></div>
  `;
  $("#outBtn").onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  $("#newBtn").onclick = () => openNewProduct();
  $("#syncBtn").onclick = () => renderSyncScreen();
  $("#bestBtn").onclick = () => renderBestsellersScreen();
  $("#bulkBtn").onclick = () => renderBulkEdit(null);
  $("#lowStockBtn").onclick = () => renderLowStock();

  const box = $("#searchBox");
  let t;
  box.addEventListener("input", () => {
    clearTimeout(t);
    if(!box.value.trim()){ renderCategoryGrid(); return; }
    t = setTimeout(()=>runSearch(box.value), 250);
  });
  box.addEventListener("keydown", e => { if(e.key==="Enter"){ clearTimeout(t); runSearch(box.value, true); } });

  await renderCategoryGrid();
}

/* ---------------- grade de categorias (tela inicial) ---------------- */
const CAT_ICONS = {
  essencias:"💨", narguile:"🫧", headshop:"🧰", tabacos:"🚬", charutos:"🍂",
  palha:"🌾", cigarrilhas:"📜", cigarros:"🚬", isqueiros:"🔥", incensos:"🕯️",
  doces:"🍬", bebidas:"🥃", conveniencia:"🔌",
};
async function renderCategoryGrid(){
  state.lastView = renderCategoryGrid;
  const area = $("#browseArea");
  area.innerHTML = `<div class="loading">Carregando categorias…</div>`;
  const parents = state.categories.filter(c=>!c.parent_id);
  const { data: counts } = await sb.from("products").select("category_id");
  const childToParent = {};
  state.categories.forEach(c => { if(c.parent_id) childToParent[c.id] = c.parent_id; });
  const countByParent = {};
  (counts||[]).forEach(p => {

async function openCategory(parentId, slug, childId){
  state.lastView = () => openCategory(parentId, slug, childId);

  area.innerHTML = `<div class="loading">Carregando…</div>`;
  const parent = state.categories.find(c=>c.id===parentId);
  const children = state.categories.filter(c=>c.parent_id===parentId);
  const childIds = children.map(c=>c.id);

  const filtroIds = childId ? [childId] : childIds;
  const { data: rows } = await sb.from("products")
    .select("*").in("category_id", filtroIds.length?filtroIds:["00000000-0000-0000-0000-000000000000"])
    .order("brand", {nullsFirst:false}).order("name").limit(400);

  area.innerHTML = `

async function runSearch(qRaw, fromScan){
  const q = qRaw.trim();
  const area = $("#browseArea");
  if(!q){ renderCategoryGrid(); return; }
  state.lastView = () => runSearch(qRaw, false);
  area.innerHTML = `<div class="plist" id="plist"><div class="loading">Buscando…</div></div>`;

  // EAN bipado costuma ser só dígitos e vir seguido de Enter: tenta igualdade exata primeiro
  let rows = [];
  if(/^\d{6,}$/.test(q)){
    const { data } = await sb.from("products").select("*").or(`ean.eq.${q},sku.eq.${q}`).limit(20);
    rows = data || [];
  }
  if(rows.length === 0){
    const { data } = await sb.from("products")
      .select("*")
      .or(`name.ilike.%${q}%,sku.ilike.%${q}%,ean.ilike.%${q}%`)
      .order("name").limit(40);
    rows = data || [];
  }
  state.results = rows;
  if(fromScan && rows.length === 1){ openProduct(rows[0].id); return; }

  area.innerHTML = `<div class="plist" id="plist"></div>`;
  renderProductRows(rows, $("#plist"), `Nada encontrado para "${esc(q)}".`);
}

function renderCategoryOptions(selectedId){
  const parents = state.categories.filter(c=>!c.parent_id);
  let html = "";
  parents.forEach(parent => {

      html += `<option value="${parent.id}" ${parent.id===selectedId?'selected':''}>${esc(parent.name)}</option>`;
    } else {

/* ---------------- processa qualquer foto pra quadrado 1:1, sem depender do tamanho/proporção original ---------------- */
/* ---------------- recorte interativo da foto (arrastar + zoom, tipo WhatsApp/Instagram) ---------------- */
function abrirRecorteImagem(file, ladoMax = 1024, qualidade = 0.9){
  return new Promise((resolve, reject) => {
    if(!file){ reject(new Error("Nenhum arquivo selecionado.")); return; }
    if(!file.type || !file.type.startsWith("image/")){ reject(new Error("Selecione um arquivo de imagem (jpg, png, webp...).")); return; }

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não consegui abrir esse arquivo como imagem.")); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if(!iw || !ih){ URL.revokeObjectURL(url); reject(new Error("Imagem inválida.")); return; }

      const veil = document.createElement("div");
      veil.className = "crop-veil";
      veil.innerHTML = `
        <div class="crop-hint">Arraste pra posicionar e use o zoom pra enquadrar o produto.</div>
        <div class="crop-view" id="cropView"><img id="cropImg" src="${url}" alt=""></div>
        <div class="crop-controls">🔍<input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1"></div>
        <div class="crop-actions">
          <button class="btn-ghost" id="cropCancelar">Cancelar</button>
          <button class="btn-gold" id="cropConfirmar">Usar essa foto</button>
        </div>`;
      document.body.appendChild(veil);

      const view = veil.querySelector("#cropView"), imgEl = veil.querySelector("#cropImg"), zoomEl = veil.querySelector("#cropZoom");
      const S = view.clientWidth; // viewport é sempre quadrado
      const baseScale = S / Math.min(iw, ih); // zoom=1 cobre o quadrado todo, tipo object-fit:cover
      let z = 1, offX = (S - iw*baseScale)/2, offY = (S - ih*baseScale)/2;

      function aplicar(){
        const dispW = iw*baseScale*z, dispH = ih*baseScale*z;
        offX = Math.min(0, Math.max(S - dispW, offX));
        offY = Math.min(0, Math.max(S - dispH, offY));
        imgEl.style.transform = `translate(${offX}px,${offY}px) scale(${baseScale*z})`;
        imgEl.style.width = iw+"px"; imgEl.style.height = ih+"px";
      }
      aplicar();

      let arrastando = false, px = 0, py = 0;
      view.addEventListener("pointerdown", e => { arrastando = true; px = e.clientX; py = e.clientY; view.setPointerCapture(e.pointerId); });
      view.addEventListener("pointermove", e => {
        if(!arrastando) return;
        offX += e.clientX - px; offY += e.clientY - py; px = e.clientX; py = e.clientY;
        aplicar();
      });
      ["pointerup","pointercancel","pointerleave"].forEach(ev => view.addEventListener(ev, () => arrastando = false));
      zoomEl.addEventListener("input", () => { z = parseFloat(zoomEl.value); aplicar(); });

      function limpar(){ URL.revokeObjectURL(url); veil.remove(); }

      veil.querySelector("#cropCancelar").onclick = () => { limpar(); resolve(null); };

      veil.querySelector("#cropConfirmar").onclick = () => {
        // mapeia o quadrado visível (0,0 a S,S na tela) de volta pras coordenadas originais da imagem
        const sx = -offX/(baseScale*z), sy = -offY/(baseScale*z), lado = S/(baseScale*z);
        const out = Math.min(ladoMax, Math.round(lado)); // nunca amplia além do que a imagem original tem
        const canvas = document.createElement("canvas");
        canvas.width = out; canvas.height = out;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
        canvas.toBlob(blob => {
          limpar();
          if(!blob){ reject(new Error("Não consegui processar essa imagem.")); return; }
          resolve({ blob, previewUrl: canvas.toDataURL("image/jpeg", 0.8) });
        }, "image/jpeg", qualidade);
      };
    };
    img.src = url;
  });
}

function processarFotoQuadrada(file, ladoMax = 1024, qualidade = 0.9){
  return new Promise((resolve, reject) => {
    if(!file){ reject(new Error("Nenhum arquivo selecionado.")); return; }
    if(!file.type || !file.type.startsWith("image/")){ reject(new Error("Selecione um arquivo de imagem (jpg, png, webp...).")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const lado = Math.min(img.naturalWidth, img.naturalHeight);
        if(!lado){ throw new Error("Imagem inválida."); }
        const sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
        const out = Math.min(ladoMax, lado); // nunca amplia além do que a imagem original tem
        const canvas = document.createElement("canvas");
        canvas.width = out; canvas.height = out;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          if(!blob){ reject(new Error("Não consegui processar essa imagem.")); return; }
          resolve({ blob, previewUrl: canvas.toDataURL("image/jpeg", 0.8) });
        }, "image/jpeg", qualidade);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não consegui abrir esse arquivo como imagem.")); };
    img.src = url;
  });
}

async function uploadPhoto(productId, file){
  if(!file) return;
  let processada;
  try{
    processada = await abrirRecorteImagem(file);
  }catch(e){ toast(e.message || "Não consegui processar essa foto."); return; }
  if(!processada) return; // cancelou o enquadramento, sem toast de erro
  toast("Enviando foto…");
  const path = `${productId}.jpg`;
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, processada.blob, { upsert: true, contentType: "image/jpeg" });
  if(upErr){ toast("Erro ao enviar: " + upErr.message); return; }
  const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(path);
  const urlComVersao = pub.publicUrl + "?v=" + Date.now(); // evita foto antiga em cache quando o nome do arquivo se repete
  // troca "limpa": remove vínculos antigos desse produto e grava o novo, pra nunca sobrar foto duplicada/errada
  await sb.from("product_images").delete().eq("product_id", productId);
  const { error: insErr } = await sb.from("product_images").insert({ product_id: productId, url: urlComVersao, is_primary: true });
  if(insErr){ toast("Erro ao vincular: " + insErr.message); return; }
  toast("Foto atualizada.");
  openProduct(productId);
}

/* ---------------- sincronizar planilha de compra ---------------- */
const COL_HINTS = {
  name: ["nome","produto","descri","item"],
  cost: ["custo","compra","preco de custo","preço de custo"],
  qty: ["quant","qtd","estoque","unidade"],
  code: ["codigo","código","sku","ean","barras"],
  vendas: ["vendas","vendido","qtd vendida","quantidade vendida","mais vendido","unidades vendidas"],
};
function normHeader(h){
  return (h||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function acharColuna(headers, chaves){
  for(let i=0;i<headers.length;i++){
    const h = normHeader(headers[i]);
    if(chaves.some(c => h.includes(normHeader(c)))) return i;
  }
  return -1;
}
function scoreClasse(s){ return s>=0.5 ? "alta" : s>=0.25 ? "media" : "baixa"; }

async function handleSyncFile(file){
  const body = $("#syncBody");
  body.innerHTML = `<div class="loading">Lendo planilha…</div>`;

  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if(rows.length < 2){ body.innerHTML = `<div class="empty">Planilha vazia ou sem linhas de dados.</div>`; return; }

  const headers = rows[0];
  const iName = acharColuna(headers, COL_HINTS.name);
  const iCost = acharColuna(headers, COL_HINTS.cost);
  const iQty  = acharColuna(headers, COL_HINTS.qty);
  const iCode = acharColuna(headers, COL_HINTS.code);

  if(iName === -1){
    body.innerHTML = `<div class="empty">Não encontrei uma coluna de nome/produto nessa planilha. Colunas vistas: ${headers.map(esc).join(", ")}</div>`;
    return;
  }

  const linhas = rows.slice(1)
    .filter(r => (r[iName]||"").toString().trim())
    .map(r => ({
      nome: (r[iName]||"").toString().trim(),
      custo: iCost>-1 ? parseFloat((r[iCost]||"").toString().replace(",",".")) || null : null,
      qtd: iQty>-1 ? parseInt((r[iQty]||"").toString().replace(/\D/g,""),10) || 0 : 0,
      codigo: iCode>-1 ? (r[iCode]||"").toString().trim() : "",
    }));

  body.innerHTML = `<div class="loading">Comparando ${linhas.length} itens com o catálogo…</div>`;

  const candidatos = [];
  for(const linha of linhas){
    let matches = [];
    if(linha.codigo){
      const { data } = await sb.from("products").select("id,name,sku,ean,stock,cost_price,price").or(`sku.eq.${linha.codigo},ean.eq.${linha.codigo}`).limit(3);
      if(data && data.length) matches = data.map(d => ({...d, score: 1}));
    }
    if(matches.length === 0){
      const { data } = await sb.rpc("buscar_produto_similar", { busca: linha.nome });
      matches = data || [];
    }
    candidatos.push({ linha, matches, escolhido: matches[0] || null });
  }

  renderSyncReview(candidatos, file.name);
}

async function confirmarSync(candidatos, tbody, fileName){
  const linhasSelecionadas = [...tbody.querySelectorAll("tr")].filter(tr => tr.querySelector(".rowChk").checked);
  if(linhasSelecionadas.length === 0){ toast("Nada selecionado."); return; }

  let ok = 0, falhou = 0;
  for(const tr of linhasSelecionadas){
    const idx = tr.dataset.idx;
    const c = candidatos[idx];
    if(!c.escolhido) continue;
    const custo = parseFloat(tr.querySelector(".rowCusto").value);
    try{
      if(c.linha.qtd > 0){
        const { error } = await sb.rpc("registrar_movimento_estoque", {
          p_product_id: c.escolhido.id, p_type: "entrada", p_quantity: c.linha.qtd,
          p_note: `Planilha: ${fileName}`
        });
        if(error) throw error;
      }
      if(!isNaN(custo)){
        const { error: e2 } = await sb.from("products").update({ cost_price: custo }).eq("id", c.escolhido.id);
        if(e2) throw e2;
      }
      ok++;
    } catch(e){ falhou++; }
  }
  toast(`Sincronizado: ${ok} produto(s)${falhou ? `, ${falhou} com erro` : ""}.`);
  renderMain();
}

/* ---------------- processa qualquer foto pra sempre sair 1:1, mesma resolução, boa qualidade ---------------- */
/* Isso roda ANTES de subir pro Storage — garante que, não importa o tamanho/proporção original
   da foto, o arquivo final é sempre igual (quadrado, 1000x1000, webp), então nunca pode quebrar
   o layout do site por causa do tamanho de uma imagem. */
async function processarImagem(file, lado=1000, qualidade=0.88){
  const bitmap = await createImageBitmap(file);
  const menor = Math.min(bitmap.width, bitmap.height);
  const sx = (bitmap.width - menor) / 2, sy = (bitmap.height - menor) / 2;
  const canvas = document.createElement("canvas");
  canvas.width = lado; canvas.height = lado;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(bitmap, sx, sy, menor, menor, 0, 0, lado, lado);
  return await new Promise(res => canvas.toBlob(res, "image/webp", qualidade));
}

let scannerAtivo = null;
function abrirScannerCamera(onResult){
  const veil = document.createElement("div");
  veil.className = "scanner-veil";
  veil.innerHTML = `
    <div class="scanner-box">
      <div id="scanRegion"></div>
      <div class="scanner-hint">Aponte a câmera pro código de barras.</div>
      <button class="btn-ghost" id="scanCancelar">Cancelar</button>
    </div>`;
  document.body.appendChild(veil);

  const html5Qr = new Html5Qrcode("scanRegion", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
    ],
  });
  scannerAtivo = html5Qr;

  function fechar(){
    if(scannerAtivo){ scannerAtivo.stop().catch(()=>{}).finally(()=>scannerAtivo=null); }
    veil.remove();
  }
  veil.querySelector("#scanCancelar").onclick = fechar;

  html5Qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (texto) => { onResult(texto); fechar(); },
    () => {} // ignora falhas de leitura quadro a quadro
  ).catch(() => {
    veil.querySelector(".scanner-hint").textContent = "Não consegui acessar a câmera. Confirme a permissão do navegador.";
  });
}

      <h2 style="font-size:20px;margin-bottom:8px">Edição em massa</h2>
      <select id="bulkCatFiltro" style="margin-bottom:10px">${parentOptions}</select>
      <p class="t" style="font-size:12px;color:var(--muted);margin:0 0 12px">Clica na foto pra anexar ou reajustar. Marca a caixinha pra selecionar vários e aplicar uma ação de uma vez.</p>
      <div id="bulkList"><div class="loading">Carregando produtos…</div></div>
    </div>
    <div id="bulkBar" class="bulk-actionbar" hidden></div>`;
  $("#backBtn").onclick = () => renderMain();
  $("#bulkCatFiltro").onchange = (e) => renderBulkEdit(e.target.value || null);

  const childIds = parentId ? state.categories.filter(c=>c.parent_id===parentId).map(c=>c.id) : null;

  let q = sb.from("products").select("*").order("name").limit(600);
  if(childIds) q = q.in("category_id", childIds.length?childIds:["00000000-0000-0000-0000-000000000000"]);
  const { data: rows } = await q;
  const ids = (rows||[]).map(r=>r.id);
  const { data: imgs } = await sb.from("product_images").select("product_id,url").in("product_id", ids.length?ids:["00000000-0000-0000-0000-000000000000"]);
  const imgByProduct = {}; (imgs||[]).forEach(i => imgByProduct[i.product_id] = i.url);

  const list = $("#bulkList");
  if(!rows || rows.length===0){ list.innerHTML = `<div class="empty">Nenhum produto nessa categoria.</div>`; return; }

  list.innerHTML = rows.map(p => `
    <div class="bulk-row" data-id="${p.id}">
      <input type="checkbox" class="bulk-chk" data-sel>
      <div class="thumb-mini" data-thumb>${imgByProduct[p.id] ? `<img src="${imgByProduct[p.id]}" alt="">` : esc(p.icon||"📦")}</div>
      <div class="nm" title="${esc(p.name)}">
        ${esc(p.name)}
        <span class="pub-badge ${p.is_active?'on':'off'}" data-pub>${p.is_active?'🟢 Publicado':'⚪ Despublicado'}</span>
      </div>
      <div class="campos">
        <div class="f"><label>Preço</label><input type="number" step="0.01" data-f="price" value="${p.price}"></div>
        <div class="f"><label>Custo</label><input type="number" step="0.01" data-f="cost_price" value="${p.cost_price ?? ''}"></div>
        <div class="f"><label>Promo</label><input type="number" step="0.01" data-f="promo_price" value="${p.promo_price ?? ''}"></div>
      </div>
      <button class="btn-gold btn-sm bulkSaveBtn" data-save>Salvar</button>
      <input type="file" accept="image/*" hidden data-filein>
    </div>`).join("");

  list.querySelectorAll(".bulk-row").forEach(row => {
    const id = row.dataset.id;
    const img = imgByProduct[id];
    const marcaSuja = () => { row.classList.add("dirty"); const b=row.querySelector("[data-save]"); b.textContent="Salvar"; b.classList.remove("saved"); };
    row.querySelectorAll("input[data-f]").forEach(inp => inp.addEventListener("input", marcaSuja));

    row.querySelector("[data-sel]").onchange = (e) => {
      if(e.target.checked) bulkSelecionados.add(id); else bulkSelecionados.delete(id);
      row.classList.toggle("selected", e.target.checked);
      renderBulkBar(parentId);
    };

    row.querySelector("[data-save]").onclick = async () => {
      const campos = {};
      row.querySelectorAll("input[data-f]").forEach(inp => {
        const v = inp.value.trim();
        campos[inp.dataset.f] = v === "" ? null : parseFloat(v);
      });
      if(campos.price == null) campos.price = 0;
      const { error } = await sb.from("products").update(campos).eq("id", id);
      const b = row.querySelector("[data-save]");
      if(error){ toast("Erro: " + error.message); return; }
      row.classList.remove("dirty"); b.textContent="✓ Salvo"; b.classList.add("saved");
    };

    row.querySelector("[data-thumb]").onclick = async () => {
      if(img){
        try{
          const resp = await fetch(img);
          if(!resp.ok) throw new Error("não consegui baixar a foto atual");
          const blob = await resp.blob();
          await uploadPhoto(id, blob); // reajustar a foto que já existe
        }catch(e){ toast("Não consegui carregar a foto atual: " + e.message); return; }
      } else {
        row.querySelector("[data-filein]").click();
        return; // o onchange abaixo cuida do resto
      }
      renderBulkEdit(parentId);
    };
    row.querySelector("[data-filein]").onchange = async (e) => {
      const file = e.target.files[0]; if(!file) return;
      await uploadPhoto(id, file);
      renderBulkEdit(parentId); // recarrega a lista pra já mostrar a foto nova
    };
  });
}

function renderBulkBar(parentId){
  const bar = $("#bulkBar");
  const n = bulkSelecionados.size;
  if(n === 0){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML = `
    <span class="bulk-count">${n} selecionado${n>1?'s':''}</span>
    <button class="btn-ghost btn-sm" data-act="preco">Alterar preço</button>
    <button class="btn-ghost btn-sm" data-act="custo">Alterar custo</button>
    <button class="btn-ghost btn-sm" data-act="publicar">Publicar</button>
    <button class="btn-ghost btn-sm" data-act="despublicar">Despublicar</button>
    <button class="btn-ghost btn-sm" data-act="cancelar">Cancelar</button>
  `;
  bar.querySelector('[data-act="cancelar"]').onclick = () => renderBulkEdit(parentId);
  bar.querySelector('[data-act="publicar"]').onclick = () => confirmarBulkPublicacao(parentId, true);
  bar.querySelector('[data-act="despublicar"]').onclick = () => confirmarBulkPublicacao(parentId, false);
  bar.querySelector('[data-act="preco"]').onclick = () => abrirBulkValor(parentId, "price", "Novo preço de venda");
  bar.querySelector('[data-act="custo"]').onclick = () => abrirBulkValor(parentId, "cost_price", "Novo preço de custo");
}

function abrirBulkValor(parentId, campo, titulo){
  const n = bulkSelecionados.size;
  const veil = document.createElement("div");
  veil.className = "crop-veil";
  veil.innerHTML = `
    <div class="card" style="width:min(90vw,340px)">
      <h3 style="margin-bottom:10px">${titulo}</h3>
      <input type="number" step="0.01" id="bulkValorInput" placeholder="R$ 0,00" style="margin-bottom:12px">
      <div class="save-row">
        <button class="btn-ghost" id="bulkValorCancelar" style="flex:1">Cancelar</button>
        <button class="btn-gold" id="bulkValorConfirmar" style="flex:1">Aplicar a ${n} produto${n>1?'s':''}</button>
      </div>
    </div>`;
  document.body.appendChild(veil);
  const input = veil.querySelector("#bulkValorInput");
  input.focus();
  veil.querySelector("#bulkValorCancelar").onclick = () => veil.remove();
  veil.querySelector("#bulkValorConfirmar").onclick = async () => {
    const v = parseFloat(input.value);
    if(isNaN(v) || v < 0){ toast("Informe um valor válido."); return; }
    if(!confirm(`Aplicar R$ ${v.toFixed(2)} a ${n} produto${n>1?'s':''}?`)) return;
    const { error } = await sb.from("products").update({ [campo]: v }).in("id", [...bulkSelecionados]);
    veil.remove();
    if(error){ toast("Erro: " + error.message); return; }
    toast(`${campo==='price'?'Preço':'Custo'} atualizado em ${n} produto${n>1?'s':''}.`);
    renderBulkEdit(parentId);
  };
}

async function confirmarBulkPublicacao(parentId, publicar){
  const n = bulkSelecionados.size;
  const acao = publicar ? "Publicar" : "Despublicar";
  if(!confirm(`${acao} ${n} produto${n>1?'s':''}?`)) return;
  const { error } = await sb.from("products").update({ is_active: publicar }).in("id", [...bulkSelecionados]);
  if(error){ toast("Erro: " + error.message); return; }
  toast(`${n} produto${n>1?'s':''} ${publicar?'publicado(s)':'despublicado(s)'}.`);
  renderBulkEdit(parentId);
}

/* ---------------- estoque baixo (menos de 10, exceto destilados e vinho) ---------------- */
const LOW_STOCK_LIMIT = 10;
const LOW_STOCK_EXCLUDE_SUB = ["whisky","gin","vodka","vinho"];

async function renderLowStock(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><img src="../favicon/apple-touch-icon.png" alt="" class="brand-logo"><b>Brutt</b><span>admin</span></div>
      <button class="btn-ghost btn-sm" id="backBtn">← Voltar</button>
    </div>
    <div style="padding:16px 0">
      <h2 style="font-size:20px;margin-bottom:4px">⚠️ Estoque baixo</h2>
      <p class="t" style="font-size:12px;color:var(--muted);margin:0 0 12px">
        Produtos ativos com menos de ${LOW_STOCK_LIMIT} unidades (não conta whisky, gin, vodka, vinho e Red Bull — esses vendem em volume bem menor).
      </p>
      <div class="plist" id="plist"><div class="loading">Carregando…</div></div>
    </div>`;
  $("#backBtn").onclick = () => renderMain();

  const excluirIds = state.categories
    .filter(c => LOW_STOCK_EXCLUDE_SUB.includes((c.name||"").toLowerCase()))
    .map(c => c.id);

  let q = sb.from("products").select("*").lt("stock", LOW_STOCK_LIMIT).eq("is_active", true).order("stock");
  if(excluirIds.length) q = q.not("category_id", "in", `(${excluirIds.join(",")})`);
  q = q.not("name", "ilike", "%redbull%").not("name", "ilike", "%red bull%");
  const { data: rows, error } = await q;

  if(error){ $("#plist").innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`; return; }
  renderProductRows(rows || [], $("#plist"), "Nenhum produto com estoque baixo agora — tudo certo por aqui.");
}

boot();
</script>
