  return true;
}
/* ---------------- notificações neste aparelho (Web Push) ----------------
   O aparelho se inscreve no serviço de push do navegador com a chave pública do servidor (checkout?acao=push_chave)
   e a inscrição vai para push_assinaturas (RPC push_registrar). A função checkout avisa "Pix gerado" e "Pedido PAGO"
   mesmo com o painel fechado; o sw.js mostra a notificação e abre o painel no toque.
   iPhone/iPad: só funciona com o painel instalado na Tela de Início (iOS 16.4+). */
const NTF_SUPORTA = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const NTF_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const NTF_INSTALADO = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ntfBytes = s => { const t = s.replace(/-/g, "+").replace(/_/g, "/"), b = atob(t + "=".repeat((4 - t.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
function ntfAparelho(){
  const u = navigator.userAgent, so = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) || NTF_IOS ? "iPad" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "Computador";
  const nav = /Edg\//.test(u) ? "Edge" : /SamsungBrowser/.test(u) ? "Samsung" : /CriOS|Chrome\//.test(u) ? "Chrome" : /Firefox|FxiOS/.test(u) ? "Firefox" : /Safari/.test(u) ? "Safari" : "navegador";
  return `${so} · ${nav}${NTF_INSTALADO ? " (app)" : ""}`;
}
async function ntfReg(){ return NTF_SUPORTA ? (await navigator.serviceWorker.getRegistration("./")) || null : null; }
async function ntfEstado(){
  if(!NTF_SUPORTA) return NTF_IOS && !NTF_INSTALADO ? "ios" : "sem";
  if(Notification.permission === "denied") return "bloqueado";
  const reg = await ntfReg(), sub = reg && await reg.pushManager.getSubscription();
  return sub && Notification.permission === "granted" ? "ativo" : "inativo";
}
async function ntfChamar(acao, corpo){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPA_URL}/functions/v1/checkout?acao=${acao}`, { method:"POST",
    headers:{ apikey: SUPA_KEY, Authorization: "Bearer " + session.access_token, "Content-Type":"application/json" }, body: JSON.stringify(corpo || {}) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.erro || ("erro " + r.status));
  return j;
}
async function ntfSalvar(sub){
  const js = sub.toJSON();
  const { error } = await sb.rpc("push_registrar", { p_endpoint: js.endpoint, p_p256dh: js.keys.p256dh, p_auth: js.keys.auth, p_aparelho: ntfAparelho() });
  if(error) throw new Error(error.message);
}
async function ntfAtivar(){
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error(perm === "denied" ? "Você bloqueou as notificações. Libere nas configurações do navegador." : "Permissão não concedida.");
  const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
  await navigator.serviceWorker.ready;
  const { publicKey } = await ntfChamar("push_chave");
  if(!publicKey) throw new Error("O servidor não mandou a chave de notificação. Tente de novo em instantes.");
  let sub = await reg.pushManager.getSubscription();
  if(sub){   /* inscrição antiga com outra chave do servidor: refaz */
    const k = sub.options && sub.options.applicationServerKey;
    const igual = k && btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") === publicKey;
    if(!igual){ await sub.unsubscribe().catch(() => {}); sub = null; }
  }
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ntfBytes(publicKey) });
  await ntfSalvar(sub);
  return sub;
}
async function ntfDesativar(){
  const reg = await ntfReg(), sub = reg && await reg.pushManager.getSubscription();
  if(sub){ await sb.rpc("push_remover", { p_endpoint: sub.endpoint }); await sub.unsubscribe().catch(() => {}); }
}
async function ntfTestar(){
  const reg = await ntfReg(), sub = reg && await reg.pushManager.getSubscription();
  if(!sub) throw new Error("Este aparelho não está inscrito.");
  await ntfChamar("push_teste", { endpoint: sub.endpoint });
}
let ntfRenovado = false;
async function desenhaNotif(){
  const box = $("#ntfBox"); if(!box) return;
  const st = await ntfEstado(); if(!$("#ntfBox")) return;
  if(st === "ativo" && !ntfRenovado){   /* 1x por sessão: confirma a inscrição no banco (o navegador pode ter trocado) */
    ntfRenovado = true; ntfReg().then(r => r && r.pushManager.getSubscription()).then(s => s && ntfSalvar(s)).catch(() => {});
  }
  const txt = {
    ativo:     ["ok",  "Notificações ligadas neste aparelho", "Você recebe “Pix gerado” e “Pedido PAGO” mesmo com o painel fechado."],
    inativo:   ["off", "Receba aviso de pedido neste aparelho", "Pix gerado e pedido pago chegam como notificação, igual app, mesmo com o painel fechado."],
    bloqueado: ["bad", "Notificações bloqueadas neste navegador", "Libere em: cadeado/ⓘ ao lado do endereço → Notificações → Permitir. Depois toque em “Ativar”."],
    ios:       ["off", "No iPhone: instale o painel para receber avisos", "Toque em Compartilhar (□↑) → “Adicionar à Tela de Início”. Abra o “Brutt Painel” pelo ícone e ative aqui."],
    sem:       ["bad", "Este navegador não recebe notificações", "Use o Chrome (Android/PC), Edge, Firefox ou o Safari com o painel instalado na Tela de Início."],
  }[st];
  box.innerHTML = `<div class="ntf ntf-${txt[0]}"><span class="ntf-ic">${ic("bell")}</span><span class="ntf-tx"><b>${txt[1]}</b><small>${txt[2]}</small></span>
    <span class="ntf-bt">${st === "ativo" ? `<button class="btn-ghost btn-sm" id="ntfTeste">Testar</button><button class="btn-ghost btn-sm" id="ntfDes">Desligar</button>`
      : st === "inativo" || st === "bloqueado" ? `<button class="btn-salvia btn-sm" id="ntfAtv">Ativar notificações</button>` : ""}</span></div>`;
  const acao = (id, fn, ok) => { const b = $("#" + id); if(b) b.onclick = async () => { b.disabled = true;
    try{ await fn(); if(ok) toast(ok); }catch(e){ toast(e.message || String(e)); } b.disabled = false; desenhaNotif(); }; };
  acao("ntfAtv", async () => { await ntfAtivar(); await ntfTestar().catch(() => {}); }, "Pronto! Mandei uma notificação de teste.");
  acao("ntfTeste", ntfTestar, "Notificação de teste enviada. Deve chegar em segundos.");
  acao("ntfDes", ntfDesativar, "Notificações desligadas neste aparelho.");
}
/* mesmo critério da tela "Estoque baixo" (ativos com menos de LOW_STOCK_LIMIT, sem destilados/vinho/Red Bull) */
function filtroEstoqueBaixo(q){
  const excluirIds = state.categories.filter(c => LOW_STOCK_EXCLUDE_SUB.includes((c.name||"").toLowerCase())).map(c => c.id);
  q = q.lt("stock", LOW_STOCK_LIMIT).eq("is_active", true);
  if(excluirIds.length) q = q.not("category_id", "in", `(${excluirIds.join(",")})`);
  return q.not("name", "ilike", "%redbull%").not("name", "ilike", "%red bull%");
}

const fmtQuando = iso => iso ? new Date(iso).toLocaleString("pt-BR", {timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "—";
function haQuanto(iso){
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
  return m < 1 ? "agora mesmo" : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m/60)} h` : `há ${Math.floor(m/1440)} d`;
}

/* cartões de status da tela inicial (loja aberta? / última sincronização com o Nex) */
async function carregarStatusInicio(){
  const rota = rotaAtual();
  const [h, l] = await Promise.all([
    sb.from("loja_horarios").select("*"),
    sb.from("nex_sync_log").select("ran_at,ok,erro,modo,origem,estoque_alterado,preco_alterado,casados,nex_total").order("id",{ascending:false}).limit(1),
  ]);
  if(rotaAtual() !== rota || !$("#stLoja")) return;   // o usuário já saiu da tela inicial
  // loja
  try{
    const porDia = {}; (h.data||[]).forEach(r => porDia[r.dia] = r);
    const linhas = HR_DIAS.map(({d}) => { const r = porDia[d], pad = HR_PADRAO[d];
      return { d, aberto: r ? !!r.aberto : !!pad, a: r ? r.abre_min : (pad?pad[0]:840), b: r ? r.fecha_min : (pad?pad[1]:1440) }; });
    const st = hrStatus(linhas);
    $("#stLoja").innerHTML = `<div class="k">Loja agora</div><div class="v" style="color:${st.aberto?"var(--ok)":"var(--danger)"}"><span class="dot ${st.aberto?"ok":"bad"}"></span>${st.aberto?"ABERTA":"FECHADA"}</div>
      <div class="d">${st.aberto ? "até "+st.fim : (st.nunca ? "nenhum dia aberto" : "abre "+st.quando+" às "+st.hora)} · toque para editar</div>`;
    $("#stLoja").classList.toggle("bad", false);
  }catch(_){ $("#stLoja").innerHTML = `<div class="k">Loja agora</div><div class="v">—</div>`; }
  // nex
  const r = l.data && l.data[0];
  if(l.error || !r){
    $("#stNex").innerHTML = `<div class="k">Estoque × Nex</div><div class="v">Sem registro ainda</div><div class="d">toque para sincronizar</div>`; return;
  }
  const velho = (Date.now() - new Date(r.ran_at).getTime()) > 45*60000;
  const ruim = !r.ok || velho;
  $("#stNex").classList.toggle("bad", ruim);
  $("#stNex").innerHTML = `<div class="k">Estoque × Nex</div>
    <div class="v"><span class="dot ${ruim?"bad":"ok"}"></span>${!r.ok ? "Última rodada falhou" : velho ? "Parou de sincronizar?" : "Em dia"}</div>
    <div class="d">${haQuanto(r.ran_at)} · ${r.modo==="teste" ? "simulação" : (r.estoque_alterado ?? 0)+" estoque(s) e "+(r.preco_alterado ?? 0)+" preço(s) alterado(s)"}</div>`;
}

  state.lastView = () => openCategory(parentId, slug, childId);
  const area = $("#browseArea");
  area.innerHTML = `<div class="loading">Carregando…</div>`;
  const parent = state.categories.find(c=>c.id===parentId);
  const children = state.categories.filter(c=>c.parent_id===parentId);
  const childIds = children.map(c=>c.id);

  const filtroIds = childId ? [childId] : childIds;
  const { data: rows } = await sb.from("products")
    .select("*").in("category_id", filtroIds.length?filtroIds:["00000000-0000-0000-0000-000000000000"])
    .order("brand", {nullsFirst:false}).order("name").limit(400);

async function runSearch(qRaw, fromScan){
  const q = qRaw.trim();
  const area = $("#browseArea");
  if(!q){ renderCategoryGrid(); return; }
  state.lastView = () => runSearch(qRaw, false);
  area.innerHTML = `<div class="plist" id="plist"><div class="loading">Buscando…</div></div>`;

  // EAN bipado costuma ser só dígitos e vir seguido de Enter: tenta igualdade exata primeiro
  let rows = [];
  if(/^\d{6,}$/.test(q)){
    const { data } = await sb.from("products").select("*").or(`ean.eq.${q},sku.eq.${q}`).limit(20);
    rows = data || [];
  }
  if(rows.length === 0){
    const { data } = await sb.from("products")
      .select("*")
      .or(`name.ilike.%${pgv(q)}%,sku.ilike.%${pgv(q)}%,ean.ilike.%${pgv(q)}%`)
      .order("name").limit(40);
    rows = data || [];
  }
  state.results = rows;
  if(fromScan && rows.length === 1){ openProduct(rows[0].id); return; }

  area.innerHTML = `<div class="plist" id="plist"></div>`;
  renderProductRows(rows, $("#plist"), `Nada encontrado para "${esc(q)}".`);
}

/* ===================== Sommelier IA: ficha de QUALQUER produto ===================== */
const SOM_EIXOS = [["citrico","🍊","Cítrico"],["tropical","🏝️","Tropical"],["doce","🍓","Adocicado"],["mentolado","🍃","Mentolado"]];
const SOM_DESC_MAX = 170;            /* o site corta com "…" tudo que passar disso */
const SOM_PESQUISAR_PADRAO = true;   /* pesquisa na internet LIGADA (o projeto do Gemini agora tem faturamento). Se a pesquisa for recusada, a função segue sem ela e avisa na tela. */
const SOM_WHISKY = [["origem","País/Região"],["tipo","Tipo"],["destilaria","Destilaria"],["composicao","Composição"],["barril","Barril"],["idade","Idade"],["abv","ABV"],["cor","Cor"],["intro","Introdução"],["nariz","Nariz"],["paladar","Paladar"],["finalizacao","Finalização"],["perfil","Perfil"],["sugestao","Sugestão de consumo"],["obs","Observação"]];

function somCompacta(txt, max){
  max = max || SOM_DESC_MAX;
  const s = String(txt||"").replace(/\s+/g," ").trim();
  if(s.length <= max) return s;
  const corte = s.slice(0,max), fim = Math.max(corte.lastIndexOf(". "),corte.lastIndexOf("! "),corte.lastIndexOf("? "));
  if(fim >= 60) return corte.slice(0,fim+1);
  const sp = corte.lastIndexOf(" ");
  return corte.slice(0, sp>60 ? sp : max).replace(/[,;:–-]\s*$/,"").replace(/\.+$/,"") + ".";
}
function somCatInfo(categoryId){
  const c = state.categories.find(x=>x.id===categoryId), pa = c && state.categories.find(x=>x.id===c.parent_id);
  const slugPai = pa ? pa.slug : (c ? c.slug : "");
  return { categoria: pa ? pa.name : (c ? c.name : ""), subcategoria: pa && c ? c.name : "", essencia: slugPai==="essencias", whisky: /whisk/i.test((c&&c.name)||"") };
}
async function somChamar(corpo){
  let r;
  try{ r = await sb.functions.invoke("gerar-ficha-sommelier",{ body: corpo }); }
  catch(e){ throw new Error("Não consegui falar com o Sommelier. Confira a internet e tente de novo."); }
  if(r.error){
    let msg = r.error.message || "erro desconhecido";
    try{ if(r.error.context && typeof r.error.context.json==="function"){ const j = await r.error.context.json(); if(j && j.erro) msg = j.erro; } }catch(_){}
    if(/Failed to send|Failed to fetch|NetworkError/i.test(msg)) msg = "Não consegui falar com o Sommelier. A função pode não estar publicada ou a internet caiu.";
    throw new Error(msg);
  }
  if(r.data && r.data.erro) throw new Error(r.data.erro);
  return r.data;
}
function somFiltraFalta(rows, falta){
  if(!falta) return rows;
  return rows.filter(p=>{
    const info = somCatInfo(p.category_id), d = (p.description||"").trim().length, f = (p.specs||[]).length;
    switch(falta){
      case "desc": return d <= 80;
      case "cortada": return d > SOM_DESC_MAX;
      case "ficha": return f <= 2;
      case "perfil": return info.essencia && !p.flavor_profile;
      case "whisky": return info.whisky && !p.whisky_details;
      case "emestoque": case "semfoto": return (Number(p.stock)||0) > 0;   /* só o que tem unidades no Nex */
      default: return true;
    }
  });
}
function somResumoTxt(p, info){
  const d = (p.description||"").trim().length, f = (p.specs||[]).length, r = t=>`<b class="som-r">${t}</b>`, g = t=>`<b class="som-g">${t}</b>`;
  const partes = [
    d===0 ? "Descrição: "+r("faltando") : d<=80 ? "Descrição: "+r(`rasa (${d} car.)`) : d>SOM_DESC_MAX ? "Descrição: "+r(`cortada no site (${d} car.)`) : "Descrição: "+g(`ok (${d} car.)`),
    "Ficha: " + (f>2 ? g(f+" itens") : r(f+(f===1?" item":" itens")))
  ];
  if(info.essencia) partes.push("Perfil de sabor: " + (p.flavor_profile ? g("ok") : r("faltando")));
  if(info.whisky) partes.push("Whisky: " + (p.whisky_details ? g("ok") : r("sem detalhes")));
  return partes.join(" · ");
}

/* mostra a sugestão da IA dentro de `box`, TUDO editável; só entra no produto quando a pessoa confirma */
function somPreview(box, d, atual, opts){
  atual = atual || {};
  const ess = d.tipo==="essencia", wh = d.tipo==="whisky";
  const conf = ({alta:["Confiança alta","ok"],media:["Confiança média","mid"],baixa:["Confiança baixa","low"]})[d.confianca] || ["Confiança média","mid"];
  const fp = d.flavor_profile || {};
  const trocaD = (atual.description||"").trim() ? ` <em>(troca a atual de ${(atual.description||"").trim().length} car.)</em>` : "";
  const trocaF = (atual.specs||[]).length ? ` <em>(troca a atual de ${atual.specs.length} itens)</em>` : "";
  box.innerHTML = `<div class="som-card">
    <div class="som-top"><span class="som-badge ${conf[1]}">${conf[0]}</span><span class="som-src">${d.pesquisou?"🔎 pesquisou na internet":"📚 sem pesquisa na internet"}${d.modelo?" · "+esc(d.modelo):""}</span></div>
    ${(d.avisos||[]).length ? `<ul class="som-avisos">${d.avisos.map(a=>`<li>⚠ ${esc(a)}</li>`).join("")}</ul>` : ""}
    <label class="som-blk"><input type="checkbox" id="smChkD" checked> <b>Descrição</b>${trocaD}</label>
    <textarea id="smDesc" rows="3">${esc(d.description||"")}</textarea>
    <div class="som-cnt" id="smCnt"></div>
    <label class="som-blk"><input type="checkbox" id="smChkF" checked> <b>Ficha técnica</b>${trocaF}</label>
    <div id="smSpecs"></div><button type="button" class="btn-ghost btn-sm" id="smAddSpec">+ item na ficha</button>
    ${ess ? `<label class="som-blk"><input type="checkbox" id="smChkP" checked> <b>Perfil de sabor</b>${atual.flavor_profile?" <em>(troca o atual)</em>":""}</label>
      <div id="smEixos">${SOM_EIXOS.map(([k,emo,lbl])=>`<div class="som-eixo"><span>${emo} ${lbl}</span><input type="range" min="0" max="10" step="1" value="${fp[k]||0}" data-eixo="${k}" aria-label="${lbl}"><b data-val>${fp[k]||0}</b></div>`).join("")}</div>` : ""}
    ${wh ? `<label class="som-blk"><input type="checkbox" id="smChkW" checked> <b>Detalhes do whisky</b>${atual.whisky_details?" <em>(troca os atuais)</em>":""}</label>
      <div id="smWhisky" class="som-wgrid">${SOM_WHISKY.map(([k,lbl])=>`<div class="field"><label>${lbl}</label><input data-wk="${k}" value="${esc((d.whisky_details||{})[k]||"")}"></div>`).join("")}</div>` : ""}
    ${(d.fontes||[]).length ? `<div class="som-fontes">Fontes: ${d.fontes.filter(f=>/^https:\/\//i.test(f.url||"")).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a>`).join(" · ")}</div>` : ""}
    <div class="save-row som-btns"><button type="button" class="btn-gold" id="smUsar">${esc(opts.rotuloUsar)}</button><button type="button" class="btn-ghost" id="smDescartar">Descartar</button></div>
  </div>`;
  const q = s => box.querySelector(s), specsBox = q("#smSpecs");
  const addRow = (k,v) => { const r=document.createElement("div"); r.className="som-spec"; r.innerHTML=`<input class="sk" placeholder="Rótulo" value="${esc(k)}"><input class="sv" placeholder="Valor" value="${esc(v)}"><button type="button" class="sx" aria-label="Remover item">×</button>`; r.querySelector(".sx").onclick=()=>r.remove(); specsBox.appendChild(r); };
  (d.specs||[]).forEach(([k,v])=>addRow(k,v)); q("#smAddSpec").onclick = () => addRow("","");
  const ta = q("#smDesc"), cnt = q("#smCnt");
  const conta = () => { const n=ta.value.trim().length;
    if(n>SOM_DESC_MAX){ cnt.innerHTML=`<span class="over">${n}/${SOM_DESC_MAX}: o site corta depois de ${SOM_DESC_MAX} caracteres.</span> <button type="button" class="som-link" id="smCortar">Ajustar</button>`; q("#smCortar").onclick=()=>{ ta.value=somCompacta(ta.value); conta(); }; }
    else cnt.innerHTML=`<span>${n}/${SOM_DESC_MAX}</span>`; };

  q("#smDescartar").onclick = () => { box.innerHTML = ""; };
  q("#smUsar").onclick = () => {
    const out = { aplicar:{ desc:q("#smChkD").checked, ficha:q("#smChkF").checked, perfil:!!(q("#smChkP")&&q("#smChkP").checked), whisky:!!(q("#smChkW")&&q("#smChkW").checked) } };
    out.description = ta.value.trim();
    out.specs = [...specsBox.querySelectorAll(".som-spec")].map(r=>[r.querySelector(".sk").value.trim(), r.querySelector(".sv").value.trim()]).filter(([k,v])=>k&&v);

    if(wh){ const w={}; box.querySelectorAll("[data-wk]").forEach(i=>{ const v=i.value.trim(); if(v) w[i.dataset.wk]=v; }); out.whisky_details=Object.keys(w).length?w:null; }

    opts.onUsar(out);
  };
}

/* ---- Sommelier dentro do editor de um produto que já existe ---- */
function somIniciaNoEditor(p){
  const infoAtual = () => somCatInfo(($("#fCat") && $("#fCat").value) || p.category_id);
  $("#somResumo").innerHTML = somResumoTxt(p, infoAtual());
  const fila = state.fila || [], pos = fila.indexOf(p.id);
  if(pos>=0 && pos<fila.length-1){
    $("#somFila").innerHTML = `<button type="button" class="btn-ghost btn-sm" id="somProx" style="width:100%;margin-top:8px">Próximo da lista (${pos+2}/${fila.length}) →</button>`;
    $("#somProx").onclick = () => openProduct(fila[pos+1]);
  }
  $("#somPesq").checked = SOM_PESQUISAR_PADRAO;
  $("#somBtn").onclick = async () => {
    const out = $("#somOut"), info = infoAtual(), atual = state.current || p;
    out.innerHTML = `<div class="loading" style="padding:14px 0">Analisando… pode levar até 20 segundos.</div>`; $("#somBtn").disabled = true;
    try{
      const data = await somChamar({ name: ($("#fName").value||p.name).trim(), brand: p.brand||"", ean: p.ean||"", categoria: info.categoria, subcategoria: info.subcategoria, pesquisar: $("#somPesq").checked,
        existente: { description: atual.description||"", specs: atual.specs||[], flavor_profile: atual.flavor_profile||null, whisky_details: atual.whisky_details||null } });
      somPreview(out, data, atual, { rotuloUsar:"Aplicar e salvar", onUsar: async (res) => {
        const upd = {};
        if(res.aplicar.desc) upd.description = res.description || null;
        if(res.aplicar.ficha) upd.specs = res.specs;
        if(res.aplicar.perfil) upd.flavor_profile = res.flavor_profile;
        if(res.aplicar.whisky) upd.whisky_details = res.whisky_details;
        if(!Object.keys(upd).length){ toast("Marque pelo menos um bloco pra aplicar."); return; }
        $("#smUsar").disabled = true;
        const { error } = await sb.from("products").update(upd).eq("id", p.id);
        if(error){ $("#smUsar").disabled = false; toast("Erro ao salvar: " + error.message); return; }
        Object.assign(state.current, upd);
        if(upd.description !== undefined && $("#fDesc")) $("#fDesc").value = upd.description || "";
        $("#somResumo").innerHTML = somResumoTxt(state.current, infoAtual());
        out.innerHTML = `<div class="som-ok">✓ Salvo no produto.</div>`; toast("Ficha salva.");
      }});
    }catch(e){ out.innerHTML = `<div class="som-erro">${esc(e.message||String(e))}</div>`; }
    finally{ $("#somBtn").disabled = false; }
  };
}

function renderCategoryOptions(selectedId){
  const parents = state.categories.filter(c=>!c.parent_id);
  let html = "";
  parents.forEach(parent => {
    const children = state.categories.filter(c=>c.parent_id===parent.id);
    if(children.length===0){
      html += `<option value="${parent.id}" ${parent.id===selectedId?'selected':''}>${esc(parent.name)}</option>`;
    } else {
      html += `<optgroup label="${esc(parent.name)}">`;
      children.forEach(ch => html += `<option value="${ch.id}" ${ch.id===selectedId?'selected':''}>${esc(ch.name)}</option>`);
      html += `</optgroup>`;
    }
  });
  return html;
}

async function saveProduct(id){
  const nome = normalizaNome($("#fName").value);
  if(nome.length < 2){ toast("O nome precisa ter pelo menos 2 letras."); return; }
  if(nome.length > 120){ toast("Nome muito longo (máx. 120 caracteres)."); return; }
  if(/^[\d\s.,]+$/.test(nome)){ toast("O nome não pode ser só números."); return; }
  const v = { price: parsePreco($("#fPrice").value), cost: state.current?.cost_price != null ? Number(state.current.cost_price) : null, promo: parsePreco($("#fPromo").value) };
  const chk = checaPrecos(v, state.current);
  if(chk.erros.length){ toast(chk.erros[0]); return; }
  const dup = await sb.from("products").select("id").ilike("name", nome.replace(/[%_\\]/g, m => "\\" + m)).neq("id", id).limit(1);
  const avisos = [...chk.avisos]; if(dup.data && dup.data.length) avisos.push("Já existe outro produto com este mesmo nome.");
  if(avisos.length && !confirm(avisos.map(a => "• " + a).join("\n") + "\n\nSalvar mesmo assim?")) return;
  $("#fName").value = nome;
  const payload = {
    name: nome,
    price: v.price,
    promo_price: v.promo,
    category_id: $("#fCat").value,
    description: $("#fDesc").value.trim() || null,
    is_active: $("#fActive").checked,
  };
  const { error } = await sb.from("products").update(payload).eq("id", id);
  if(error){ toast("Erro ao salvar: " + error.message); return; }
  toast("Produto atualizado.");
  closeDrawer();
  (state.lastView || renderCategoryGrid)();
}

async function registerMovement(productId){
  const qty = parseInt($("#mvQty").value, 10);
  if(!qty && qty !== 0){ toast("Informe a quantidade."); return; }
  const note = $("#mvNote").value.trim() || null;
  const { error } = await sb.rpc("registrar_movimento_estoque", {
    p_product_id: productId, p_type: state.mvType, p_quantity: qty, p_note: note
  });
  if(error){ toast("Erro: " + error.message); return; }
  toast("Estoque atualizado.");
  openProduct(productId);
}

/* ---------------- processa qualquer foto pra quadrado 1:1, sem depender do tamanho/proporção original ---------------- */
/* ---------------- recorte interativo da foto (arrastar + zoom, tipo WhatsApp/Instagram) ---------------- */
function abrirRecorteImagem(file, ladoMax = 1000, qualidade = 0.86){
  return new Promise((resolve, reject) => {
    if(!file){ reject(new Error("Nenhum arquivo selecionado.")); return; }
    if(!file.type || !file.type.startsWith("image/")){ reject(new Error("Selecione um arquivo de imagem (jpg, png, webp...).")); return; }

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não consegui abrir esse arquivo como imagem.")); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if(!iw || !ih){ URL.revokeObjectURL(url); reject(new Error("Imagem inválida.")); return; }

      const veil = document.createElement("div");
      veil.className = "crop-veil";
      veil.innerHTML = `
        <div class="crop-hint">Arraste pra posicionar e use o zoom pra enquadrar o produto.</div>
        <div class="crop-view" id="cropView"><img id="cropImg" src="${url}" alt=""></div>
        <div class="crop-controls">🔍<input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1"></div>
        <div class="crop-actions">
          <button class="btn-ghost" id="cropCancelar">Cancelar</button>
          <button class="btn-gold" id="cropConfirmar">Usar essa foto</button>
        </div>`;
      document.body.appendChild(veil);

      const view = veil.querySelector("#cropView"), imgEl = veil.querySelector("#cropImg"), zoomEl = veil.querySelector("#cropZoom");
      const S = view.clientWidth; // viewport é sempre quadrado
      const baseScale = S / Math.min(iw, ih); // zoom=1 cobre o quadrado todo, tipo object-fit:cover
      let z = 1, offX = (S - iw*baseScale)/2, offY = (S - ih*baseScale)/2;

      function aplicar(){
        const dispW = iw*baseScale*z, dispH = ih*baseScale*z;
        offX = Math.min(0, Math.max(S - dispW, offX));
        offY = Math.min(0, Math.max(S - dispH, offY));
        imgEl.style.transform = `translate(${offX}px,${offY}px) scale(${baseScale*z})`;
        imgEl.style.width = iw+"px"; imgEl.style.height = ih+"px";
      }
      aplicar();

      let arrastando = false, px = 0, py = 0;
      view.addEventListener("pointerdown", e => { arrastando = true; px = e.clientX; py = e.clientY; view.setPointerCapture(e.pointerId); });
      view.addEventListener("pointermove", e => {
        if(!arrastando) return;
        offX += e.clientX - px; offY += e.clientY - py; px = e.clientX; py = e.clientY;
        aplicar();
      });
      ["pointerup","pointercancel","pointerleave"].forEach(ev => view.addEventListener(ev, () => arrastando = false));
      zoomEl.addEventListener("input", () => { z = parseFloat(zoomEl.value); aplicar(); });

      function limpar(){ URL.revokeObjectURL(url); veil.remove(); }

      veil.querySelector("#cropCancelar").onclick = () => { limpar(); resolve(null); };

      veil.querySelector("#cropConfirmar").onclick = () => {
        // mapeia o quadrado visível (0,0 a S,S na tela) de volta pras coordenadas originais da imagem
        const sx = -offX/(baseScale*z), sy = -offY/(baseScale*z), lado = S/(baseScale*z);
        const out = Math.min(ladoMax, Math.round(lado)); // nunca amplia além do que a imagem original tem
        const canvas = document.createElement("canvas");
        canvas.width = out; canvas.height = out;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
        const fim = blob => { limpar(); if(!blob){ reject(new Error("Não consegui processar essa imagem.")); return; }
          resolve({ blob, ext: blob.type === "image/webp" ? "webp" : "jpg", type: blob.type || "image/jpeg", previewUrl: canvas.toDataURL("image/jpeg", 0.8) }); };
        canvas.toBlob(b => { if(b && b.type === "image/webp") fim(b); else canvas.toBlob(fim, "image/jpeg", 0.88); }, "image/webp", qualidade);   /* WebP: ~40% menor que JPEG na mesma qualidade */
      };
    };
    img.src = url;
  });
}

function processarFotoQuadrada(file, ladoMax = 1024, qualidade = 0.9){
  return new Promise((resolve, reject) => {
    if(!file){ reject(new Error("Nenhum arquivo selecionado.")); return; }
    if(!file.type || !file.type.startsWith("image/")){ reject(new Error("Selecione um arquivo de imagem (jpg, png, webp...).")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const lado = Math.min(img.naturalWidth, img.naturalHeight);
        if(!lado){ throw new Error("Imagem inválida."); }
        const sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
        const out = Math.min(ladoMax, lado); // nunca amplia além do que a imagem original tem
        const canvas = document.createElement("canvas");
        canvas.width = out; canvas.height = out;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          if(!blob){ reject(new Error("Não consegui processar essa imagem.")); return; }
          resolve({ blob, previewUrl: canvas.toDataURL("image/jpeg", 0.8) });
        }, "image/jpeg", qualidade);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não consegui abrir esse arquivo como imagem.")); };
    img.src = url;
  });
}

async function uploadPhoto(productId, file, opts = {}){
  if(!file) return null;
  let processada;
  try{
    processada = await abrirRecorteImagem(file);
  }catch(e){ toast(e.message || "Não consegui processar essa foto."); return null; }
  if(!processada) return null; // cancelou o enquadramento, sem toast de erro
  if(opts.onEnvio) opts.onEnvio();
  toast("Enviando foto…");
  const ext = processada.ext || "jpg", path = `${productId}.${ext}`;
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, processada.blob, { upsert: true, contentType: processada.type || "image/jpeg", cacheControl: "31536000" });
  if(upErr){ toast("Erro ao enviar: " + upErr.message); return null; }
  const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(path);
  const urlComVersao = pub.publicUrl + "?v=" + Date.now(); // evita foto antiga em cache quando o nome do arquivo se repete
  // troca "limpa": remove vínculos antigos desse produto e grava o novo, pra nunca sobrar foto duplicada/errada
  await sb.from("product_images").delete().eq("product_id", productId);
  const { error: insErr } = await sb.from("product_images").insert({ product_id: productId, url: urlComVersao, is_primary: true });
  if(insErr){ toast("Erro ao vincular: " + insErr.message); return null; }
  sb.storage.from(BUCKET).remove([`${productId}.${ext === "webp" ? "jpg" : "webp"}`]).catch(()=>{});
  toast("Foto atualizada (" + Math.max(1, Math.round(processada.blob.size/1024)) + " KB).");
  if(!opts.semAbrir) openProduct(productId);
  return urlComVersao;
}

/* ---------------- sincronizar planilha de compra ---------------- */
const COL_HINTS = {
  name: ["nome","produto","descri","item"],
  cost: ["custo","compra","preco de custo","preço de custo"],
  qty: ["quant","qtd","estoque","unidade"],
  code: ["codigo","código","sku","ean","barras"],
  vendas: ["vendas","vendido","qtd vendida","quantidade vendida","mais vendido","unidades vendidas"],
};
function normHeader(h){
  return (h||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function acharColuna(headers, chaves){
  for(let i=0;i<headers.length;i++){
    const h = normHeader(headers[i]);
    if(chaves.some(c => h.includes(normHeader(c)))) return i;
  }
  return -1;
}
/* acha a coluna certa SEM confundir parecidas do Nex: "Custo" ≠ "Custo Total", "Estoque Atual" ≠ "Est. Adquirido" (total já comprado) ≠ "Disponível".
   1º procura o título exato; depois, um que contenha a palavra e não seja de total/adquirido/markup/revenda. */
const COL_EVITAR = ["total","adquirid","markup","revenda","pedido","disponivel"];
function acharColunaExata(headers, exatas, contem){
  const hs = headers.map(normHeader);
  let i = hs.findIndex(h => exatas.includes(h)); if(i > -1) return i;
  return hs.findIndex(h => contem.some(c => h.includes(c)) && !COL_EVITAR.some(x => h.includes(x)));
}
function scoreClasse(s){ return s>=0.5 ? "alta" : s>=0.25 ? "media" : "baixa"; }

async function handleSyncFile(file){
  const body = $("#syncBody");
  body.innerHTML = `<div class="loading">Lendo planilha…</div>`;

  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if(rows.length < 2){ body.innerHTML = `<div class="empty">Planilha vazia ou sem linhas de dados.</div>`; return; }

  const headers = rows[0];
  const iName = acharColunaExata(headers, ["produto","nome","descricao","item"], ["produto","nome","descri","item"]);
  const iCost = acharColunaExata(headers, ["custo","preco de custo","custo unitario","custo medio","custo un"], ["custo","compra"]);
  const iQty  = -1;   /* estoque NÃO é lido daqui: quem manda no estoque é o Nex (sincroniza sozinho). Antes isto somava "Estoque Atual" da planilha de novo no site. */
  const iCode = acharColuna(headers, COL_HINTS.code);

  if(iName === -1){
    body.innerHTML = `<div class="empty">Não encontrei uma coluna de nome/produto nessa planilha. Colunas vistas: ${headers.map(esc).join(", ")}</div>`;
    return;
  }

  const linhas = rows.slice(1)
    .filter(r => (r[iName]||"").toString().trim())
    .map(r => ({
      nome: (r[iName]||"").toString().trim(),
      custo: iCost>-1 ? parseFloat((r[iCost]||"").toString().replace(",",".")) || null : null,
      qtd: iQty>-1 ? parseInt((r[iQty]||"").toString().replace(/\D/g,""),10) || 0 : 0,
      codigo: iCode>-1 ? (r[iCode]||"").toString().trim() : "",
    }));

  body.innerHTML = `<div class="loading">Comparando ${linhas.length} itens com o catálogo…</div>`;

  const candidatos = [];
  for(const linha of linhas){
    let matches = [];
    if(linha.codigo){
      const { data } = await sb.from("products").select("id,name,sku,ean,stock,cost_price,price").or(`sku.eq.${pgv(linha.codigo)},ean.eq.${pgv(linha.codigo)}`).limit(3);
      if(data && data.length) matches = data.map(d => ({...d, score: 1}));
    }
    if(matches.length === 0){
      const { data } = await sb.rpc("buscar_produto_similar", { busca: linha.nome });
      matches = data || [];
    }
    candidatos.push({ linha, matches, escolhido: matches[0] || null });
  }

  renderSyncReview(candidatos, file.name);
}

function renderSyncReview(candidatos, fileName){
  const body = $("#syncBody");
  body.innerHTML = `
    <div class="sync-summary">
      <span><b>${candidatos.length}</b> itens lidos</span>
      <span><b>${candidatos.filter(c=>c.escolhido).length}</b> com correspondência encontrada</span>
      <span><b>${candidatos.filter(c=>!c.escolhido).length}</b> sem correspondência</span>
    </div>
    <div class="tbl-wrap">
      <table class="sync-table">
        <thead><tr>
          <th><input type="checkbox" id="chkAll" checked></th>
          <th>Na planilha</th><th>Produto no catálogo</th><th>Confiança</th>
          <th>Estoque no site (Nex)</th><th>Custo</th>
        </tr></thead>
        <tbody id="syncRows"></tbody>
      </table>
    </div>
    <div class="save-row">
      <button class="btn-gold" id="syncConfirm">Confirmar e sincronizar</button>
    </div>
  `;
  const tbody = $("#syncRows");
  tbody.innerHTML = candidatos.map((c, idx) => {
    const sel = c.matches.map(m => `<option value="${m.id}" ${m.id===c.escolhido?.id?'selected':''}>${esc(m.name)} (estoque ${m.stock})</option>`).join("");
    const semMatch = !c.escolhido;
    return `
      <tr data-idx="${idx}">
        <td><input type="checkbox" class="rowChk" ${semMatch?'disabled':'checked'}></td>
        <td>${esc(c.linha.nome)}${c.linha.codigo?`<br><span class="t" style="color:var(--muted)">cód. ${esc(c.linha.codigo)}</span>`:''}</td>
        <td>
          ${c.matches.length ? `<select class="rowProd">${sel}</select><option value="">— nenhum —</option>` : `<span style="color:var(--muted)">sem sugestão</span>`}
        </td>
        <td>${c.escolhido ? `<span class="score ${scoreClasse(c.escolhido.score)}">${Math.round(c.escolhido.score*100)}%</span>` : '—'}</td>
        <td>${c.escolhido ? `${c.escolhido.stock}` : '—'}</td>
        <td><input type="number" step="0.01" class="rowCusto" value="${c.linha.custo ?? ''}" style="width:90px"></td>
      </tr>`;
  }).join("");

  $("#chkAll").onchange = e => tbody.querySelectorAll(".rowChk:not(:disabled)").forEach(c => c.checked = e.target.checked);

  tbody.querySelectorAll(".rowProd").forEach(sel => {
    sel.onchange = () => {
      const idx = sel.closest("tr").dataset.idx;
      const novo = candidatos[idx].matches.find(m => m.id === sel.value) || null;
      candidatos[idx].escolhido = novo;
      const row = sel.closest("tr");
      row.querySelector(".rowChk").disabled = !novo;
      if(novo) row.querySelector(".rowChk").checked = true;
    };
  });

  $("#syncConfirm").onclick = () => confirmarSync(candidatos, tbody, fileName);
}

async function confirmarSync(candidatos, tbody, fileName){
  const linhasSelecionadas = [...tbody.querySelectorAll("tr")].filter(tr => tr.querySelector(".rowChk").checked);
  if(linhasSelecionadas.length === 0){ toast("Nada selecionado."); return; }

  let ok = 0, falhou = 0;
  for(const tr of linhasSelecionadas){
    const idx = tr.dataset.idx;
    const c = candidatos[idx];
    if(!c.escolhido) continue;
    const custo = parseFloat(tr.querySelector(".rowCusto").value);
    try{
      if(!isNaN(custo)){
        const { error: e2 } = await sb.from("products").update({ cost_price: custo }).eq("id", c.escolhido.id);
        if(e2) throw e2;
      }
      ok++;
    } catch(e){ falhou++; }
  }
  toast(`Sincronizado: ${ok} produto(s)${falhou ? `, ${falhou} com erro` : ""}.`);
  go("home");
}

    const semMatch = !c.escolhido;
    return `
      <tr data-idx="${idx}">
        <td><input type="checkbox" class="rowChk" ${semMatch?'disabled':'checked'}></td>
        <td>${esc(c.linha.nome)}${c.linha.codigo?`<br><span class="t" style="color:var(--muted)">cód. ${esc(c.linha.codigo)}</span>`:''}</td>
        <td>${c.matches.length ? `<select class="rowProd">${sel}</select>` : `<span style="color:var(--muted)">não encontrado no catálogo online</span>`}</td>
        <td>${c.escolhido ? `<span class="score ${scoreClasse(c.escolhido.score)}">${Math.round(c.escolhido.score*100)}%</span>` : '—'}</td>
        <td>${c.escolhido ? `${c.escolhido.sales_count ?? 0} → ${c.linha.vendas}` : '—'}</td>
      </tr>`;
  }).join("");

  $("#chkAllBest").onchange = e => tbody.querySelectorAll(".rowChk:not(:disabled)").forEach(c => c.checked = e.target.checked);
  tbody.querySelectorAll(".rowProd").forEach(sel => {
    sel.onchange = () => {
      const idx = sel.closest("tr").dataset.idx;
      candidatos[idx].escolhido = candidatos[idx].matches.find(m => m.id === sel.value) || null;
    };
  });

  $("#bestConfirm").onclick = () => confirmarBestsellers(candidatos, tbody);
}

async function confirmarBestsellers(candidatos, tbody){
  const linhasSelecionadas = [...tbody.querySelectorAll("tr")].filter(tr => tr.querySelector(".rowChk").checked);
  if(linhasSelecionadas.length === 0){ toast("Nada selecionado."); return; }

  let ok = 0, falhou = 0;
  for(const tr of linhasSelecionadas){
    const idx = tr.dataset.idx;
    const c = candidatos[idx];
    if(!c.escolhido) continue;
    const { error } = await sb.from("products").update({ sales_count: c.linha.vendas }).eq("id", c.escolhido.id);
    if(error) falhou++; else ok++;
  }
  toast(`Atualizado: ${ok} produto(s)${falhou ? `, ${falhou} com erro` : ""}.`);
  go("home");
}

/* ---------------- processa qualquer foto pra sempre sair 1:1, mesma resolução, boa qualidade ---------------- */
/* Isso roda ANTES de subir pro Storage — garante que, não importa o tamanho/proporção original
   da foto, o arquivo final é sempre igual (quadrado, 1000x1000, webp), então nunca pode quebrar
   o layout do site por causa do tamanho de uma imagem. */
async function processarImagem(file, lado=1000, qualidade=0.88){
  const bitmap = await createImageBitmap(file);
  const menor = Math.min(bitmap.width, bitmap.height);
  const sx = (bitmap.width - menor) / 2, sy = (bitmap.height - menor) / 2;
  const canvas = document.createElement("canvas");
  canvas.width = lado; canvas.height = lado;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(bitmap, sx, sy, menor, menor, 0, 0, lado, lado);
  return await new Promise(res => canvas.toBlob(res, "image/webp", qualidade));
}

let scannerAtivo = null;
function abrirScannerCamera(onResult){
  const veil = document.createElement("div");
  veil.className = "scanner-veil";
  veil.innerHTML = `
    <div class="scanner-box">
      <div id="scanRegion"></div>
      <div class="scanner-hint">Aponte a câmera pro código de barras.</div>
      <button class="btn-ghost" id="scanCancelar">Cancelar</button>
    </div>`;
  document.body.appendChild(veil);

  const html5Qr = new Html5Qrcode("scanRegion", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
    ],
  });
  scannerAtivo = html5Qr;

  function fechar(){
    if(scannerAtivo){ scannerAtivo.stop().catch(()=>{}).finally(()=>scannerAtivo=null); }

  html5Qr.start(

/* ---------------- números e nomes: aceita jeito de brasileiro e pega erro humano antes de gravar ---------------- */
function parsePreco(v){                       /* "25,90" "R$ 1.234,56" "12.5" "" -> número | null (vazio) | NaN (lixo) */
  let t = String(v ?? "").trim().replace(/[R$\s]/g, ""); if(t === "") return null;
  if(!/^[\d.,]+$/.test(t)) return NaN;
  if(t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g, "");
  else if(/^\d{1,3}\.\d{3}$/.test(t)) t = t.replace(".", "");          /* "1.234" é mil duzentos e trinta e quatro */
  const n = Number(t); return Number.isFinite(n) ? Math.round(n*100)/100 : NaN;
}
const fmtNum = n => (n == null || n === "" || isNaN(+n)) ? "" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
function checaPrecos(v, antigo){
  const erros = [], avisos = [], campos = [], nome = {price:"Preço", cost:"Custo", promo:"Promo"};
  for(const k of ["price","cost","promo"]) if(Number.isNaN(v[k]) || (v[k] != null && v[k] < 0)){ erros.push(`${nome[k]} inválido: use só números, por exemplo 25,90.`); campos.push(k); }
  if(!erros.length){
    if(v.price == null){ erros.push("Informe o preço de venda."); campos.push("price"); }
    else if(v.promo != null && v.promo >= v.price && v.price > 0){ erros.push("A promoção precisa ser menor que o preço normal."); campos.push("promo"); }
  }
  if(!erros.length){
    if(v.price === 0) avisos.push("Preço zerado: o produto aparece sem valor no site.");
    if(v.price > 3000) avisos.push(`Preço de R$ ${fmtNum(v.price)} é muito alto. Foi digitado um zero a mais?`);
    if(v.cost != null && v.cost > v.price && v.price > 0) avisos.push(`Custo (R$ ${fmtNum(v.cost)}) maior que o preço de venda: dá prejuízo.`);
    if(v.promo != null && v.cost != null && v.promo < v.cost) avisos.push("A promoção fica abaixo do custo.");
    const a = Number(antigo?.price);
    if(a > 0 && v.price > 0 && (v.price/a > 1.6 || v.price/a < .6)) avisos.push(`O preço mudou de R$ ${fmtNum(a)} para R$ ${fmtNum(v.price)}.`);
  }
  return { erros, avisos, campos };
}
function normalizaNome(s){                    /* espaços sobrando, pontuação solta, primeira letra */
  let t = String(s ?? "").replace(/\s+/g, " ").trim().replace(/^[\-–—.,;:|\/\\]+|[\-–—,;:|\/\\]+$/g, "").trim();
  t = t.replace(/\s+([,.;:!?])/g, "$1").replace(/([!?]){2,}/g, "$1");
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}

    };

    row.querySelector("[data-save]").onclick = async () => {
      const antigo = prodById[id], v = lerPrecos(), chk = checaPrecos(v, antigo);
      inputs.forEach(i => i.classList.remove("bad")); nameEl.classList.remove("bad"); descEl.classList.remove("bad");
      const nome = normalizaNome(nameEl.value), desc = descEl.value.replace(/\s+\n/g, "\n").trim();
      if(nome.length < 2){ nameEl.classList.add("bad"); toast("O nome precisa ter pelo menos 2 letras."); return; }
      if(nome.length > 120){ nameEl.classList.add("bad"); toast("Nome muito longo (máx. 120 caracteres)."); return; }
      if(/^[\d\s.,]+$/.test(nome)){ nameEl.classList.add("bad"); toast("O nome não pode ser só números."); return; }
      if(chk.erros.length){ chk.campos.forEach(k => inputs[{price:0,cost:1,promo:2}[k]]?.classList.add("bad")); toast(chk.erros[0]); return; }
      const avisos = [...chk.avisos];
      if(nome !== antigo.name){
        const dup = await sb.from("products").select("id").ilike("name", nome.replace(/[%_\\]/g, m => "\\" + m)).neq("id", id).limit(1);
        if(dup.data && dup.data.length) avisos.push("Já existe outro produto com este mesmo nome.");
      }
      if(desc.length > SOM_DESC_MAX){ descEl.classList.add("bad"); dscBox.hidden = false; dtog.setAttribute("aria-expanded", true); avisos.push(`A descrição tem ${desc.length} caracteres e o site corta depois de ${SOM_DESC_MAX} (vai aparecer com “…”).`); }
      if(avisos.length && !confirm(avisos.map(a => "• " + a).join("\n") + "\n\nSalvar mesmo assim?")) return;
      const campos = { name: nome, description: desc || null, price: v.price, cost_price: v.cost, promo_price: v.promo };
      const { error } = await sb.from("products").update(campos).eq("id", id);
      const b = row.querySelector("[data-save]");
      if(error){ toast("Erro: " + error.message); return; }
      Object.assign(antigo, campos);
      nameEl.value = nome; descEl.value = desc; atualizaCnt(); dtog.textContent = "✎ descrição" + (desc ? "" : " (vazia)");
      inputs[0].value = fmtNum(v.price); inputs[1].value = fmtNum(v.cost); inputs[2].value = fmtNum(v.promo); atualizaMargem();
      row.classList.remove("dirty"); b.textContent="✓ Salvo"; b.classList.add("saved");
    };

    const abreFoto = () => row.querySelector("[data-filein]").click();
    row.querySelector("[data-thumb]").onclick = abreFoto;
    row.querySelector("[data-foto]").onclick = abreFoto;
    row.querySelector("[data-filein]").onchange = async (e) => {
      const file = e.target.files[0]; e.target.value = ""; if(!file) return;
      const ph = row.querySelector("[data-thumb]");
      const url = await uploadPhoto(id, file, { semAbrir:true, onEnvio: () => ph.classList.add("subindo") });   /* enquadra (arrastar + zoom), comprime e envia */
      ph.classList.remove("subindo");
      if(url){ ph.classList.remove("vazio"); ph.innerHTML = `<img src="${esc(url)}" alt=""><span class="cam">📷</span>`; }   /* troca só a miniatura, sem recarregar a lista */
    };
  });
}

function abrirBulkValor(campo, titulo){
  const n = bulkSelecionados.size;
  const veil = document.createElement("div");
  veil.className = "crop-veil";
  veil.innerHTML = `
    <div class="card" style="width:min(90vw,340px)">
      <h3 style="margin-bottom:10px">${titulo}</h3>
      <input type="number" step="0.01" id="bulkValorInput" placeholder="R$ 0,00" style="margin-bottom:12px">
      <div class="save-row">

      </div>
    </div>`;
  document.body.appendChild(veil);
  const input = veil.querySelector("#bulkValorInput");
  input.focus();
  veil.querySelector("#bulkValorCancelar").onclick = () => veil.remove();
  veil.querySelector("#bulkValorConfirmar").onclick = async () => {
    const v = parseFloat(input.value);
    if(isNaN(v) || v < 0){ toast("Informe um valor válido."); return; }

async function confirmarBulkPublicacao(publicar){
  const n = bulkSelecionados.size;

/* ---------- Horário de funcionamento: o SITE e o agente de IA leem daqui. Com a loja fechada, o cliente não consegue enviar pedido. ---------- */
const HR_DIAS = [{d:1,n:"Segunda"},{d:2,n:"Terça"},{d:3,n:"Quarta"},{d:4,n:"Quinta"},{d:5,n:"Sexta"},{d:6,n:"Sábado"},{d:0,n:"Domingo"}];
const HR_PADRAO = {1:null, 2:[840,1410], 3:[840,1410], 4:[840,1410], 5:[690,1500], 6:[720,1500], 0:[720,1440]};   /* o que valia antes de existir esta tela */
const hrHHMM = m => { m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const hrMin = v => { const m=/^(\d{2}):(\d{2})$/.exec(v||""); return m && +m[1]<24 && +m[2]<60 ? (+m[1])*60+ +m[2] : null; };
function hrAgoraSP(now){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(now||new Date()).map(x=>[x.type,x.value]));
  let hr=+p.hour; if(hr===24) hr=0; return {d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday], min:hr*60+ +p.minute};
}
/* mesma conta do site: aberto agora? senão, quando abre */
function hrStatus(linhas, now){
  const {d,min}=hrAgoraSP(now), t=d*1440+min, W=10080, ints=[], DM=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  linhas.forEach(x=>{ if(!x.aberto) return; [-W,0,W].forEach(o=>ints.push([x.d*1440+x.a+o, x.d*1440+x.b+o])); });
  const cur=ints.find(([a,b])=>t>=a&&t<b); if(cur) return {aberto:true, fim:hrHHMM(cur[1])};
  const prox=ints.filter(([a])=>a>t).sort((x,y)=>x[0]-y[0])[0]; if(!prox) return {aberto:false, nunca:true};
  const dia=Math.floor((((prox[0]%W)+W)%W)/1440); return {aberto:false, quando: dia===d?"hoje":DM[dia], hora:hrHHMM(prox[0])};
}

async function nexDisparar(modo){
  if(nexRodando) return;
  nexRodando = true;
  const bR = $("#nxReal"), bT = $("#nxTeste"), msg = $("#nxMsg");
  bR.disabled = bT.disabled = true; (modo === "real" ? bR : bT).classList.add("is-busy"); msg.style.color = "var(--muted)";
  msg.textContent = modo === "real" ? "Sincronizando com o Nex… (leva uns segundos)" : "Simulando… nada será gravado.";
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    const r = await fetch(`${SUPA_URL}/functions/v1/sync-nex?modo=${modo}`, { method:"POST", signal: ctl.signal,
      headers:{ apikey: SUPA_KEY, Authorization: "Bearer " + (session?.access_token || SUPA_KEY), "Content-Type":"application/json" }, body:"{}" });
    clearTimeout(to);
    const j = await r.json().catch(() => ({}));
    if(r.status === 403){ throw new Error("Sem permissão. Entre com o login da equipe."); }
    if(!r.ok && !j.erro){ throw new Error("O servidor respondeu " + r.status); }
    if(j.erro || j.ok === false){ msg.style.color = "var(--red)"; msg.textContent = j.erro || "A sincronização não gravou nada."; }
    else toast(modo === "real" ? "Sincronizado" : "Simulação pronta");
  }catch(e){
    msg.style.color = "var(--red)"; msg.textContent = e.name === "AbortError" ? "O Nex demorou demais para responder. Tente de novo em instantes." : "Não consegui sincronizar: " + e.message;
  }finally{
    nexRodando = false;
    if(rotaAtual() === "nex"){ const keep = $("#nxMsg")?.textContent, col = $("#nxMsg")?.style.color; await renderNex(); if(keep && col === "var(--red)"){ $("#nxMsg").style.color = col; $("#nxMsg").textContent = keep; } }
  }
}

/* ================= FOTOS EM LOTE =================
   Arrasta várias fotos de uma vez. Pra cada uma o admin: (1) comprime (WebP, 1000×1000, ~60–150 KB), (2) descobre de qual produto ela é
   — primeiro pelo nome do arquivo / código de barras, depois lendo a embalagem com IA (função identificar-foto) —
   (3) deixa você conferir, e só então envia. Nada vai pro site sem você apertar "Enviar". */
const FT = { itens:[], cat:[], imgs:{}, alvos:null, ia:true, substituir:false, seq:0, enviando:false };
const ftNorm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const FT_LIXO = new Set(["img","image","imagem","foto","photo","dsc","whatsapp","wa","copy","copia","screenshot","jpg","jpeg","png","webp","heic","de","da","do","e","com","para","the","at","pm","am"]);
function ftTokens(s){ return ftNorm(s).split(" ").filter(t => t && !FT_LIXO.has(t) && !/^\d{6,}$/.test(t)); }
const ftPool = () => FT.alvos ? FT.cat.filter(p => FT.alvos.includes(p.id)) : FT.cat;
const ftKB = b => b >= 1048576 ? (b/1048576).toFixed(1).replace(".",",")+" MB" : Math.max(1,Math.round(b/1024))+" KB";

function ftMatchArquivo(nome){
  const base = String(nome||"").replace(/\.[^.]+$/,""), pool = ftPool();
  for(const d of (base.match(/\d{8,14}/g)||[])){
    const p = pool.find(x => x.ean === d || x.sku === d);
    if(p) return [{ id:p.id, name:p.name, confianca:1, fonte:"código" }];
  }
  const tk = ftTokens(base); if(!tk.length) return [];
  const out = [];
  for(const p of pool){
    const pt = p._t; if(!pt.size) continue;
    let inter = 0; for(const t of tk) if(pt.has(t) || (t.length > 3 && [...pt].some(x => x.length > 3 && (x.startsWith(t) || t.startsWith(x))))) inter++;
    if(!inter) continue;
    const P = inter/tk.length, R = inter/pt.size; let f = 2*P*R/(P+R);
    if(P === 1) f = Math.max(f, R === 1 ? .98 : .86 + .1*R);          /* tudo que está no nome do arquivo existe no produto */
    if(f >= .5) out.push({ id:p.id, name:p.name, confianca:Math.min(.98, +f.toFixed(2)), fonte:"arquivo", exato: P === 1 && R === 1 });
  }
  out.sort((a,b) => b.confianca - a.confianca);
  const top = out[0];
  if(top) for(const o of out.slice(1)){                                 /* dois produtos quase iguais: não escolhe sozinho */
    if(top.confianca - o.confianca < .05 && !(top.exato && !o.exato)){ top.confianca = Math.min(top.confianca, .7); o.confianca = Math.min(o.confianca, .7); }
  }
  return out.slice(0,3).map(({exato, ...c}) => c);
}

/* comprime e enquadra: quase quadrada -> corta no centro; muito retangular -> centraliza inteira sobre a cor do fundo (sem cortar o produto) */
async function ftPreparar(file){
  const bmp = await createImageBitmap(file, { imageOrientation:"from-image" }).catch(() => createImageBitmap(file));
  const w = bmp.width, h = bmp.height, razao = w/h;
  const cover = razao >= .85 && razao <= 1.18;
  const lado = cover ? Math.min(1000, Math.min(w,h)) : Math.min(1000, Math.max(w,h));
  const c = document.createElement("canvas"); c.width = c.height = Math.max(300, lado);
  const x = c.getContext("2d");
  if(cover){
    const m = Math.min(w,h); x.drawImage(bmp, (w-m)/2, (h-m)/2, m, m, 0, 0, c.width, c.height);
  } else {
    const t = document.createElement("canvas"); t.width = 4; t.height = 4; const tx = t.getContext("2d");
    tx.drawImage(bmp, 0, 0, 4, 4);                                         /* 4×4 médio: os cantos dizem a cor do fundo */
    const d = tx.getImageData(0,0,4,4).data, cantos = [0, 3, 12, 15].map(i => [d[i*4], d[i*4+1], d[i*4+2]]);
    const med = [0,1,2].map(k => Math.round(cantos.reduce((s,q) => s+q[k], 0)/4));
    const var_ = Math.max(...[0,1,2].map(k => Math.max(...cantos.map(q => q[k])) - Math.min(...cantos.map(q => q[k]))));
    x.fillStyle = var_ < 40 ? `rgb(${med})` : "#fff"; x.fillRect(0,0,c.width,c.height);
    const s = Math.min(c.width/w, c.height/h), dw = w*s, dh = h*s;
    x.imageSmoothingQuality = "high"; x.drawImage(bmp, (c.width-dw)/2, (c.height-dh)/2, dw, dh);
  }
  const blobDe = (tipo, q) => new Promise(r => c.toBlob(r, tipo, q));
  let blob = await blobDe("image/webp", .86);
  if(!blob || blob.type !== "image/webp") blob = await blobDe("image/jpeg", .88);
  for(const q of [.78, .68]) if(blob.size > 220*1024 && blob.type === "image/webp") blob = await blobDe("image/webp", q);
  const mini = document.createElement("canvas"), r2 = Math.min(1, 640/Math.max(w,h));
  mini.width = Math.round(w*r2); mini.height = Math.round(h*r2); mini.getContext("2d").drawImage(bmp, 0, 0, mini.width, mini.height);
  const b64 = mini.toDataURL("image/jpeg", .72).split(",")[1];
  bmp.close && bmp.close();
  return { blob, b64, modo: cover ? "corte" : "inteira" };
}

async function ftIA(it){
  const { data:{ session } } = await sb.auth.getSession();
  for(let tent = 0; tent < 3; tent++){
    const r = await fetch(SUPA_URL + "/functions/v1/identificar-foto", { method:"POST",
      headers:{ "Content-Type":"application/json", apikey:SUPA_KEY, Authorization:"Bearer " + session.access_token },
      body: JSON.stringify({ imagem: it.b64, mime:"image/jpeg", nome_arquivo: it.file.name, alvos: FT.alvos || undefined }) });
    const j = await r.json().catch(() => ({}));
    if(r.status === 429 && tent < 2){ await new Promise(z => setTimeout(z, 12000)); continue; }
    if(!r.ok) throw new Error(j.erro || ("IA indisponível (" + r.status + ")"));
    return j;
  }
}

async function ftProcessa(it){
  try{
    it.estado = "comprimindo"; ftAtualizaCard(it);
    const p = await ftPreparar(it.file);
    it.blob = p.blob; it.b64 = p.b64; it.modo = p.modo;
    if(it.url) URL.revokeObjectURL(it.url); it.url = URL.createObjectURL(it.blob);
    it.estado = "identificando"; ftAtualizaCard(it);
    let cands = ftMatchArquivo(it.file.name), lido = "";
    const bomLocal = !!cands[0] && cands[0].confianca >= .9;      /* empate entre dois produtos já foi rebaixado para .7 em ftMatchArquivo */
    if(!bomLocal && FT.ia){
      try{
        const r = await ftIA(it); lido = r.lido || "";
        const ids = new Set((r.candidatos||[]).map(c => c.id));
        cands = [...(r.candidatos||[]).map(c => ({ ...c, fonte:"IA" })), ...cands.filter(c => !ids.has(c.id))].slice(0,3);
      }catch(e){ it.aviso = e.message || "IA indisponível"; }
    }
    it.lido = lido; it.cands = cands;
    const top = cands[0];
    if(top && top.confianca >= .75){ it.pid = top.id; it.on = !FT.imgs[top.id] || FT.substituir; it.estado = "ok"; }
    else { it.pid = null; it.on = false; it.estado = top ? "revisar" : "semmatch"; }
    ftDuplicados();
  }catch(e){ it.estado = "erro"; it.aviso = "Não consegui ler essa foto (" + (e.message||"erro") + ")."; }
  ftAtualizaCard(it); ftRodape();
}

function ftDuplicados(){
  const vistos = new Set();
  for(const it of FT.itens){
    it.dup = false;
    if(it.pid && it.on){ if(vistos.has(it.pid)){ it.dup = true; it.on = false; } else vistos.add(it.pid); }
  }
}

function ftRodape(){

async function ftEnviar(){
  const fila = FT.itens.filter(i => i.on && i.pid && i.blob && ["ok","revisar","semmatch"].includes(i.estado));
  if(!fila.length) return;
  FT.enviando = true; ftRodape(); let ok = 0, falhou = 0, idx = 0;
  const um = async () => {
    while(idx < fila.length){
      const it = fila[idx++]; it.estado = "enviando"; ftAtualizaCard(it);
      try{
        const ext = it.blob.type === "image/webp" ? "webp" : "jpg", path = `${it.pid}.${ext}`;
        const { error:e1 } = await sb.storage.from(BUCKET).upload(path, it.blob, { upsert:true, contentType: it.blob.type, cacheControl:"31536000" });
        if(e1) throw e1;
        const { data:pub } = sb.storage.from(BUCKET).getPublicUrl(path), url = pub.publicUrl + "?v=" + Date.now();
        await sb.from("product_images").delete().eq("product_id", it.pid);
        const { error:e2 } = await sb.from("product_images").insert({ product_id: it.pid, url, is_primary:true });
        if(e2) throw e2;
        sb.storage.from(BUCKET).remove([`${it.pid}.${ext === "webp" ? "jpg" : "webp"}`]).catch(() => {});   /* arquivo antigo do outro formato, se existir */
        FT.imgs[it.pid] = url; it.estado = "enviada"; it.on = false; ok++;
      }catch(e){ it.estado = "falhou"; it.aviso = e.message || "erro ao enviar"; falhou++; }
      ftAtualizaCard(it);
    }
  };
  await Promise.all([um(), um(), um()]);
  FT.enviando = false; ftRodape();
  toast(`${ok} foto${ok===1?"":"s"} enviada${ok===1?"":"s"}${falhou?`, ${falhou} com erro`:""}.`);
}

function ftAdiciona(files){
  const imgs = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if(!imgs.length){ toast("Escolha arquivos de imagem."); return; }
  const novos = imgs.map(f => ({ k: ++FT.seq, file: f, estado:"comprimindo", on:false, pid:null, cands:[] }));
  FT.itens.push(...novos); novos.forEach(ftAtualizaCard); ftRodape();
  let i = 0;
  const trab = async () => { while(i < novos.length) await ftProcessa(novos[i++]); };
  Promise.all([trab(), trab(), trab()]).then(ftRodape);
}

async function ftCarregaCatalogo(){
  const cat = [];
  for(let de = 0; ; de += 1000){
    const { data, error } = await sb.from("products").select("id,name,brand,ean,sku").order("name").range(de, de+999);
    if(error || !data) break; cat.push(...data); if(data.length < 1000) break;
  }
  cat.forEach(p => { p._t = new Set(ftTokens(p.name)); p._n = ftNorm(p.name); });
  FT.cat = cat; FT.imgs = {};
  for(let de = 0; ; de += 1000){
    const { data } = await sb.from("product_images").select("product_id,url").range(de, de+999);
    if(!data) break; data.forEach(r => FT.imgs[r.product_id] = r.url); if(data.length < 1000) break;
  }
}

/* recomprime as fotos já enviadas que passam de 100 KB (fotos antigas em JPEG): WebP 86%, mesmo tamanho em pixels
   (no máximo 1000 px). Só troca se o arquivo novo ficar pelo menos 20% menor — senão deixa a original. */
async function ftOtimizar(){
  const b = $("#ftOtim"), txt = $("#ftOtimTxt"); if(b.disabled) return;
  b.disabled = true; b.textContent = "Procurando fotos pesadas…";
  const fim = m => { b.disabled = false; b.textContent = "Otimizar fotos pesadas"; if(txt) txt.textContent = m; toast(m); };
  const { data: arqs, error } = await sb.storage.from(BUCKET).list("", { limit: 2000 });
  if(error) return fim("Não consegui listar as fotos: " + error.message);
  const pesadas = (arqs || []).filter(a => (a.metadata?.size || 0) > 100 * 1024 && /\.(jpe?g|png|webp)$/i.test(a.name));
  if(!pesadas.length) return fim("Nenhuma foto acima de 100 KB. Está tudo leve.");
  if(!confirm(`${pesadas.length} foto(s) acima de 100 KB. Recomprimir em WebP (sem mudar o tamanho da imagem)?`)) return fim("Nada foi alterado.");
  let trocadas = 0, antes = 0, depois = 0, i = 0;
  for(const a of pesadas){
    b.textContent = `Otimizando ${++i}/${pesadas.length}…`;
    try{
      const pid = a.name.replace(/\.[^.]+$/, ""), { data: pub } = sb.storage.from(BUCKET).getPublicUrl(a.name);
      const bm = await createImageBitmap(await (await fetch(pub.publicUrl + "?t=" + Date.now(), { cache: "no-store" })).blob());
      const k = Math.min(1, 1000 / Math.max(bm.width, bm.height)), c = document.createElement("canvas");
      c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bm, 0, 0, c.width, c.height);
      const novo = await new Promise(r => c.toBlob(r, "image/webp", 0.86));
      if(!novo || novo.type !== "image/webp" || novo.size > a.metadata.size * 0.8) continue;
      const path = pid + ".webp";
      const up = await sb.storage.from(BUCKET).upload(path, novo, { upsert: true, contentType: "image/webp", cacheControl: "31536000" });
      if(up.error) continue;
      const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
      const r = await sb.from("product_images").update({ url }).eq("product_id", pid);
      if(r.error) continue;
      if(a.name !== path) sb.storage.from(BUCKET).remove([a.name]).catch(() => {});
      trocadas++; antes += a.metadata.size; depois += novo.size;
    }catch(_){ /* foto que não abre: deixa como está */ }
  }
  fim(trocadas ? `${trocadas} foto(s) otimizada(s): de ${Math.round(antes / 1024)} KB para ${Math.round(depois / 1024)} KB.` : "Nenhuma ficou menor o bastante; mantive as originais.");
}

function pedLinha(p){

  const ent = (p.entrega || {}).tipo === "entrega", h = iso => iso ? new Date(iso).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" }) : "";

}
let pedFiltro = "todos";

      <div class="ped-filtros" id="pedFiltros" role="group" aria-label="Filtrar pedidos" hidden></div>
      <div id="pedLista"><div class="loading">Carregando…</div></div>
    </div>`;

  const { data, error } = await sb.from("pedidos").select("id,numero,status,reserva,cliente_nome,cliente_whats,itens,total,taxa_entrega,entrega,metodo,created_at,pago_em,saiu_em,concluido_em,visto_em,mp_status,mp_status_detail,mp_payment_id,pix_expira_em").order("created_at", { ascending:false }).limit(60);
  const el = $("#pedLista");
  if(!el) return;
  if(error){ el.innerHTML = `<div class="err">Não foi possível carregar os pedidos (${esc(error.message)}).</div>`; return; }
  if(!data.length){ el.innerHTML = `<div class="empty">Nenhum pedido online ainda.</div>`; return; }
  const brl = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
  const FILTROS = [
    ["todos", "Todos", () => true],
    ["pago", "A concluir", p => p.status === "pago"],
    ["novos", "Novos", p => p.status === "pago" && !p.visto_em],
    ["aguardando_pagamento", "Aguardando pagamento", p => p.status === "aguardando_pagamento"],
    ["concluido", "Concluídos", p => p.status === "concluido"],
    ["estornado", "Estornados", p => pedSt(p) === "estornado"],
    ["outros", "Cancelados / expirados", p => ["recusado","expirado","cancelado"].includes(pedSt(p))],
  ];
  if(!FILTROS.some(f => f[0] === pedFiltro)) pedFiltro = "todos";
  const cartao = p => {
    const e = p.entrega || {}, a = e.endereco || {};
    const ent = e.tipo === "entrega" ? `Entrega: ${esc(a.rua)}, ${esc(a.numero)}${a.complemento ? " ("+esc(a.complemento)+")" : ""} — ${esc(a.bairro||"")} · ${esc(String(e.km||"").replace(".", ","))} km` : "Cliente chama Uber Flash/99";
    const novo = p.status === "pago" && !p.visto_em, st = pedSt(p);
    const pixNovo = p.status === "aguardando_pagamento" && !p.visto_em && p.pix_expira_em && new Date(p.pix_expira_em) > new Date();
    const nota = st === "estornado" ? `O Mercado Pago devolveu ${brl(p.total)} ao cliente${p.pago_em ? ` (pago em ${fmtQuando(p.pago_em)})` : ""}. Não conta como venda.`
      : st === "cancelado" && /cancelado pela equipe/.test(p.mp_status_detail || "") ? esc(p.mp_status_detail.replace(/^c/, "C")) + "."
      : p.status === "aguardando_pagamento" && !pedCancelavel(p) ? "Pix em aberto: se o cliente não pagar, ele vence em 30 min e o pedido pode ser cancelado." : "";
    return `<article class="ped-card${novo ? " novo" : pixNovo ? " pixnovo" : p.status === "pago" ? " acao" : ["estornado","cancelado","expirado","recusado"].includes(st) ? " apagado" : ""}" data-ped="${esc(p.id)}">
      <div class="ped-h"><b>${novo ? `<span class="ped-novo">✓ Pago</span>` : pixNovo ? `<span class="ped-pix">Pix gerado</span>` : ""}<code>#${esc(p.numero)}</code>${esc(p.cliente_nome)}</b>
        <span><span class="st st-${esc(st)}">${PED_ROT[st] || esc(st)}</span>${p.reserva ? ' <span class="st st-reserva">reserva</span>' : ""}</span></div>
      <div class="ped-meta"><span>${fmtQuando(p.created_at)}</span><span>${PED_MET[p.metodo] || "—"}</span><a href="https://wa.me/${esc(p.cliente_whats)}" target="_blank" rel="noopener">WhatsApp ${esc(p.cliente_whats)}</a></div>
      <div class="ped-itens">${(p.itens||[]).map(i => `<span><b>${esc(i.qtd)}×</b>${esc(i.nome)}</span>`).join("")}</div>
      <div class="ped-ent">${ent}</div>
      ${pedLinha(p)}
      <div class="ped-f"><b>${brl(p.total)}</b>
        <span class="ped-bts">${pedBotao(p)}${pedCancelavel(p) ? `<button class="btn-ghost btn-sm" data-cancelar="${esc(p.id)}">Cancelar pedido</button>` : ""}</span></div>
      ${pedAvisa[p.id] ? `<a class="ped-avisa" data-avisa="${esc(p.id)}" href="${esc(pedAvisa[p.id])}" target="_blank" rel="noopener">${ic("ext")}Avisar no WhatsApp</a>` : ""}
      ${nota ? `<p class="ped-nota">${nota}</p>` : ""}
      ${novo ? `<p class="ped-novo-dica">Toque no pedido para parar o alerta.</p>` : ""}
    </article>`;
  };
  const desenha = () => {
    const f = FILTROS.find(x => x[0] === pedFiltro), lista = data.filter(f[2]), fx = $("#pedFiltros");
    fx.hidden = false;
    fx.innerHTML = FILTROS.map(([k, t, fn]) => `<button type="button" class="chip${k === pedFiltro ? " active" : ""}" data-pf="${k}" aria-pressed="${k === pedFiltro}">${t}<span class="n">${data.filter(fn).length}</span></button>`).join("");
    fx.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { pedFiltro = b.dataset.pf; desenha(); });
    el.innerHTML = lista.length ? lista.map(cartao).join("") : `<div class="empty">Nenhum pedido neste filtro.</div>`;
    el.querySelectorAll(".ped-card.novo,.ped-card.pixnovo").forEach(c => c.addEventListener("click", async e => {
      if(e.target.closest("a,[data-etapa],[data-cancelar]") || c.dataset.marcando) return;
      c.dataset.marcando = "1";
      const ped = data.find(x => x.id === c.dataset.ped);
      if(await marcarVisto(ped.id)){ ped.visto_em = new Date().toISOString(); desenha(); } else delete c.dataset.marcando;
    }));
    el.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = async () => {
      const ped = data.find(x => x.id === b.dataset.cancelar); if(!ped || b.disabled) return;

      const { error } = await sb.rpc("pedido_cancelar_aberto", { p_id: ped.id, p_motivo: motivo.trim().slice(0, 120) });
      if(error){ toast("Não deu pra cancelar: " + error.message); b.disabled = false; b.textContent = "Cancelar pedido"; return; }
      Object.assign(ped, { status:"cancelado", mp_status_detail:"cancelado pela equipe" + (motivo.trim() ? ": " + motivo.trim() : "") });
      navCont.t = 0; toast(`Pedido #${ped.numero} cancelado.`); desenha();
    });
    /* "Avisar o cliente no WhatsApp": abriu a mensagem pronta → o botão some (não fica pendurado no pedido concluído) */
    el.querySelectorAll("[data-avisa]").forEach(a => a.addEventListener("click", () => { delete pedAvisa[a.dataset.avisa]; setTimeout(desenha, 300); }));
    /* etapas do pedido (o cliente vê na tela "Acompanhe seu pedido"): saiu para entrega → entregue / motoboy retirou → concluído */
    el.querySelectorAll("[data-etapa]").forEach(b => b.onclick = async () => {
      if(b.disabled) return;
      const ped = data.find(x => x.id === b.dataset.pid), qual = b.dataset.etapa, rot = b.textContent;
      b.disabled = true; b.textContent = "Enviando…";
      if(ped && !ped.visto_em){ await marcarVisto(ped.id); ped.visto_em = new Date().toISOString(); }
      try{
        const saida = qual === "saiu" || qual === "retirou";   /* "saiu" no servidor = saiu para entrega (loja) / motoboy retirou (Uber/99) */
        const j = await ntfChamar(saida ? "etapa" : "concluir", saida ? { pedido_id: ped.id, etapa: "saiu" } : { pedido_id: ped.id });
        if(saida) ped.saiu_em = j.saiu_em || new Date().toISOString();
        else { ped.status = "concluido"; ped.concluido_em = new Date().toISOString(); }
        navCont.t = 0;
        if(j.whats && !j.whats.auto && j.whats.link){ pedAvisa[ped.id] = j.whats.link; toast(`#${j.numero}: ${PED_ETAPA_OK[qual]}. Toque em “Avisar no WhatsApp”.`); }
        else { delete pedAvisa[ped.id]; toast(`#${j.numero}: ${PED_ETAPA_OK[qual]}. O cliente foi avisado no WhatsApp.`); }   /* link da etapa anterior não fica pendurado */
        desenha();
      }catch(err){ toast("Não deu: " + (err.message || err)); b.disabled = false; b.textContent = rot; }
    });
  };
  desenha();
}

   Tabela public.clientes (RLS: só equipe). Pedido novo no site cria/completa o cliente sozinho (gatilho no banco). */
let cliState = { lista:null, filtro:"todos", q:"", mostra:120 };
const CLI_CAMPOS = "id,nex_uid,nex_codigo,nome,whatsapp,telefone_original,email,cep,rua,numero,complemento,bairro,cidade,uf,endereco_txt,aceita_promocoes,origem,obs,pedidos_qtd,total_gasto,primeiro_pedido_em,ultimo_pedido_em,ultima_visita_nex,completo,created_at,updated_at";
const CLI_ORIGEM = { nex:"Nex", planilha:"Planilha", site:"Site", admin:"Painel" };
/* mesma regra do banco (whats_normaliza): celular BR → 55 + DDD + 9 dígitos; senão null */
function cliWhats(t){
  let d = String(t||"").replace(/\D/g, "");
  if((d.length === 12 || d.length === 13) && d.startsWith("55")) d = d.slice(2);
  if(d.length === 9 && d[0] === "9") d = "21" + d;
  if(d.length === 8 && /[6-9]/.test(d[0])) d = "219" + d;
  if(d.length === 10 && /[6-9]/.test(d[2])) d = d.slice(0, 2) + "9" + d.slice(2);
  return (d.length === 11 && d[2] === "9" && d[0] !== "0") ? "55" + d : null;
}
const cliFone = w => w ? `(${w.slice(2,4)}) ${w.slice(4,9)}-${w.slice(9)}` : "";
const cliEnd = c => c.rua ? [c.rua + (c.numero ? ", " + c.numero : ""), c.complemento, c.bairro].filter(Boolean).join(" · ") : (c.endereco_txt || "");
const cliSemAcento = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const CLI_FILTROS = [
  ["todos", "Todos", () => true],

];

async function carregarClientes(){
  const todos = [];
  for(let de = 0; de < 10000; de += 1000){
    const { data, error } = await sb.from("clientes").select(CLI_CAMPOS).order("nome").range(de, de + 999);
    if(error){ cliState.lista = null; cliState.erro = error.message; return; }
    todos.push(...data);
    if(data.length < 1000) break;
  }
  cliState.lista = todos; cliState.erro = null;
}
function cliFiltrados(){
  const f = CLI_FILTROS.find(x => x[0] === cliState.filtro) || CLI_FILTROS[0];
  const q = cliSemAcento(cliState.q.trim()), qd = q.replace(/\D/g, "");
  return (cliState.lista || []).filter(f[2]).filter(c => !q ||
    cliSemAcento([c.nome, c.email, c.bairro, c.rua, c.endereco_txt, c.nex_codigo, c.cidade].join(" ")).includes(q) ||
    (qd.length >= 4 && ((c.whatsapp || "").includes(qd) || (c.telefone_original || "").replace(/\D/g, "").includes(qd))));
}
